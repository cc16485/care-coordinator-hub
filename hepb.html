<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your hepatitis B vaccine offer, Caring Companions</title>
<!-- HEPATITIS B VACCINE OFFER, the caregiver's page (OSHA 29 CFR 1910.1030; the owner's ruling 2026-10-13). Opened only from the
     private link the office sends (?h=<record>&e=<expiry>&t=<code>, 21 days). The server (hepb) decides everything: which answers
     are open, the exact Appendix A declination statement and its wording fingerprint. This page lays it out. The vaccine is never
     required: five answers, one of them declining by signing the federal statement word for word, and a person who declined can
     choose the vaccine here later at no cost. No medical detail is ever typed here. Nothing is kept in this browser's storage. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0D365F; --gold:#F0A63A; --gold-text:#C17A12; --bg:#faf9f6; --card:#fff; --border:#e4e1d8; --text:#16283a; --muted:#6E6559; --green:#15803D; --red:#B00020; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 70px;} header{text-align:center;padding:8px 0 4px;} header img{height:48px;max-width:100%}
  h1{font-size:23px;line-height:1.25;color:var(--navy);margin:12px 0 6px;letter-spacing:-.02em;} h2{font-size:19px;color:var(--navy);margin:0 0 6px}
  .lede{font-size:16px;margin:0 0 14px;}
  .doc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;font-size:16px;overflow-wrap:anywhere}
  .doc h3{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text);margin:14px 0 6px;} .doc h3:first-child{margin-top:0}
  .doc p{margin:0 0 10px;} .small{font-size:13px;color:var(--muted);margin:0 0 10px;}
  .status{border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:16px;border:1.5px solid;background:#F4F2ED;border-color:var(--border)}
  .status.done{background:#F0F7F4;border-color:#9BD3B0} .status b.word{display:block;font-size:18px;color:var(--navy);margin-bottom:4px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:block;width:100%;text-align:left;min-height:56px;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);cursor:pointer;touch-action:manipulation}
  .opt b{display:block;color:var(--navy);font-size:16.5px} .opt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
  .opt.on{border-color:var(--navy);background:#F4F7FB;box-shadow:0 0 0 1px var(--navy) inset}
  .statement{border:1.5px solid var(--navy);border-radius:12px;background:#fff;padding:14px 16px;font-size:16.5px;line-height:1.6;margin:10px 0}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:6px 0;cursor:pointer} .chk input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--gold)}
  label.q{display:block;font-size:15px;font-weight:600;color:var(--text);margin:10px 0 6px;}
  input[type=text]{width:100%;max-width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;min-height:48px;-webkit-appearance:none;appearance:none}
  input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pick label{flex:1 1 140px;display:flex;align-items:center;justify-content:center;min-height:52px;font-size:16px;font-weight:700;padding:12px 14px;border:1.5px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);cursor:pointer;text-align:center;touch-action:manipulation}
  .pick label.cam{background:var(--navy);color:#fff} .pick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  button.go{width:100%;min-height:52px;background:var(--gold);color:#122F52;border:0;border-radius:10px;padding:15px;font:inherit;font-size:17px;font-weight:800;margin-top:12px;cursor:pointer;touch-action:manipulation} button.go[disabled]{opacity:.55;cursor:default}
  button.plain{width:100%;min-height:48px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:10px;padding:12px;font:inherit;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
  .err{display:none;background:#FDECEC;color:var(--red);border-radius:8px;padding:10px 12px;font-size:15px;margin-top:10px;} .okmsg{background:#F0F7F4;color:var(--green);border-radius:10px;padding:12px 14px;font-size:15px;margin:10px 0;font-weight:600}
  .secure{font-size:12.5px;color:var(--muted);margin-top:8px;} .dead{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;font-size:16px;} a{color:var(--navy);}
  .busy{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none} .busy.on{opacity:.92}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><img src="https://images.leadconnectorhq.com/image/f_webp/q_80/r_1200/u_https://assets.cdn.filesafe.space/Recp0AhyMh8lrtKJ9kaj/media/691b9707bb3d037e0ad689bf.png" alt="Caring Companions"></header>
  <div id="main"><p class="lede" style="text-align:center;color:var(--muted)">Opening your vaccine offer…</p></div>
</div>
<div class="busy" id="busy">Working…</div>
<script>
const SUPA_URL = 'https://zngsgedlsxinbygwmxwn.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ3NnZWRsc3hpbmJ5Z3dteHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDIzNDQsImV4cCI6MjA5ODExODM0NH0.L_31_UKdccyRH9n7p1GaBlZTqcJipB008H-GIvxwLxM';
const FN = SUPA_URL + '/functions/v1/hepb';
const q = new URLSearchParams(location.search); const LINK = { h: q.get('h') || '', e: q.get('e') || '', t: q.get('t') || '' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PHONE = '(417) 234-8494', MAX_BYTES = 15 * 1024 * 1024;
/* the five answers, in her words */
const ANSWERS = [
  ['vaccine', 'I want the vaccine', 'Caring Companions arranges it at no cost to you, at a time and place that works for you.'],
  ['prior_series', 'I already completed the hepatitis B vaccine series', 'Add your vaccine record below if you have it, or bring it to the office.'],
  ['immune', 'A blood test shows I am already immune', 'Add the test result below if you have it, or bring it to the office.'],
  ['contraindicated', 'A doctor has told me I should not get this vaccine', 'Tell the office. We record only that you cannot receive it, never your medical details.'],
  ['declined', 'I decline the vaccine', 'You sign the federal declination statement. You can change your mind later and still get it at no cost.'],
];
const DONE_WORDS = {
  vaccine: ['You chose the vaccine', 'Thank you. The office will contact you to set up your shots at no cost to you.'],
  complete: ['Your vaccine series is complete', 'Thank you. It is recorded.'],
  prior_series: ['You told us you already completed the series', 'Thank you. The office checks your record.'],
  immune: ['You told us a blood test shows you are immune', 'Thank you. The office checks your result.'],
  contraindicated: ['You told us you should not get this vaccine', 'Thank you. The office records only that you cannot receive it. Please call if you have a note from your doctor.'],
  declined: ['You declined the vaccine', 'Your signed declination is on file. If you change your mind, choose the vaccine below at any time, at no cost to you.'],
};
const PROOF = { prior_series: ['series_proof', 'Your hepatitis B vaccine record'], immune: ['titer_proof', 'Your antibody (blood) test result'] };
const CT_BY_EXT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic', heif: 'image/heic', webp: 'image/webp', pdf: 'application/pdf' };
const ctOf = (file) => { const t = String(file.type || '').toLowerCase(); if (t === 'image/jpg') return 'image/jpeg'; if (t === 'image/heif') return 'image/heic'; return t || CT_BY_EXT[(String(file.name || '').split('.').pop() || '').toLowerCase()] || ''; };
let V = null, PICK = '', MSG = '', COPY = '';

async function call(body){
  const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON }, body: JSON.stringify({ ...body, ...LINK }) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
const main = () => document.getElementById('main');
const busy = (on, t) => { const b = document.getElementById('busy'); b.textContent = t || 'Working…'; b.classList.toggle('on', !!on); };
function dead(msg){ main().innerHTML = '<div class="dead"><b>We could not open your vaccine offer.</b><p>' + esc(msg) + '</p><p>Call or text the office at <b>' + PHONE + '</b>.</p></div>'; }
const when = (iso) => iso ? new Date(iso).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' Central' : '';
const can = (k) => (V.can_choose || []).includes(k);

function render(){
  let h = '<h1>' + (V.first ? 'Hi, ' + esc(V.first) + '.' : 'Your hepatitis B vaccine offer') + '</h1>';
  h += '<p class="lede">Because your work may bring contact with blood, Caring Companions offers you the hepatitis B vaccine at <b>no cost to you</b>. It is your choice.</p>';
  if (V.answered) { const w = DONE_WORDS[V.status] || ['Your answer is recorded', '']; h += '<div class="status done" id="stbox"><b class="word">' + esc(w[0]) + '</b>' + esc(w[1]) + (V.status === 'vaccine' && V.doses_recorded ? '<div class="small" style="margin:6px 0 0">Shots recorded so far: ' + esc(V.doses_recorded) + '</div>' : '') + '</div>'; }
  if (MSG) h += '<div class="okmsg" id="okmsg">' + esc(MSG) + (COPY ? ' <a href="' + esc(COPY) + '" target="_blank" rel="noopener">Open your signed copy</a>' : '') + '</div>';
  if (!V.answered) h += '<div class="doc"><h3>About hepatitis B</h3><p>Hepatitis B is a liver infection that can spread through contact with blood. The vaccine is a short series of shots and protects most people who get it.</p><p class="small">Questions about the vaccine? Call the office at ' + esc(V.office_phone || PHONE) + '.</p></div>';
  const open = ANSWERS.filter((a) => can(a[0]));
  if (open.length) {
    h += '<div class="doc"><h3>' + (V.answered ? 'Change your answer' : 'Your answer') + '</h3><div class="opts" role="radiogroup">';
    for (const [k, t, s] of open) h += '<button type="button" role="radio" aria-checked="' + (PICK === k) + '" class="opt' + (PICK === k ? ' on' : '') + '" data-k="' + k + '" onclick="pick(\'' + k + '\')"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></button>';
    h += '</div></div>';
  } else if (V.answered) h += '<div class="doc"><p>To change your answer, please call the office at <b>' + esc(V.office_phone || PHONE) + '</b>.</p></div>';
  if (PICK === 'declined') h += declineHtml();
  else if (PICK) h += '<div class="doc" id="confirm"><p><b>' + esc((ANSWERS.find((a) => a[0] === PICK) || [])[1]) + '</b></p><button class="go" id="b_choose" onclick="choose()">Send my answer</button><div class="err" id="e_choose"></div></div>';
  if (!PICK && PROOF[V.status] && !V.verified) h += proofHtml();
  h += '<div class="doc"><p class="small">This link is private to you. Please do not share it. Your answer is kept as a confidential medical record: only the owners of Caring Companions see it.</p></div>';
  main().innerHTML = h;
}
function pick(k){ PICK = PICK === k ? '' : k; MSG = ''; render(); const c = document.getElementById(k === 'declined' ? 'decl' : 'confirm'); if (c) c.scrollIntoView({ block: 'nearest' }); }

function declineHtml(){
  const d = V.declination || {};
  return '<div class="doc" id="decl"><h2>' + esc(d.title) + '</h2>' + (d.intro || []).map((p) => '<p>' + esc(p) + '</p>').join('')
    + '<div class="statement" id="stmt">' + esc(d.statement) + '</div>'
    + '<label class="chk"><input type="checkbox" id="c_sign"><span>I agree to sign this statement electronically.</span></label>'
    + '<label class="q" for="n_sign">Type your full name to sign</label><input type="text" id="n_sign" autocomplete="name" placeholder="First and last name">'
    + '<button class="go" id="b_sign" onclick="decline()">Sign and decline</button><div class="err" id="e_sign"></div>'
    + '<div class="secure">Your typed name, the time, your device and this exact wording are recorded with your signature.</div></div>';
}
async function choose(){
  const e = document.getElementById('e_choose'), btn = document.getElementById('b_choose');
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await call({ action: 'choose', choice: PICK });
  if (r.status !== 200 || !r.j || r.j.ok === false) { btn.disabled = false; btn.textContent = 'Send my answer'; e.style.display = 'block'; e.textContent = (r.j && r.j.error) || 'Could not send your answer. Please try again.'; return; }
  MSG = PICK === 'vaccine' ? 'Thank you. The office will contact you to set up your shots at no cost to you.' : 'Thank you. Your answer is recorded.'; COPY = ''; PICK = '';
  await reload();
}
async function decline(){
  const e = document.getElementById('e_sign'), btn = document.getElementById('b_sign');
  const name = (document.getElementById('n_sign').value || '').trim();
  const say = (m) => { e.style.display = 'block'; e.textContent = m; };
  if (!document.getElementById('c_sign').checked) return say('Please tick "I agree to sign this statement electronically" first.');
  if (name.split(/\s+/).length < 2) return say('Please type your full name, first and last.');
  btn.disabled = true; btn.textContent = 'Signing…';
  const r = await call({ action: 'decline', typed_name: name, consent: true, fingerprint: (V.declination || {}).fingerprint });
  if (r.status !== 200 || !r.j || r.j.ok === false) { btn.disabled = false; btn.textContent = 'Sign and decline'; return say((r.j && r.j.error) || 'Could not sign. Please try again.'); }
  MSG = 'Signed. Your declination is on file. You can still choose the vaccine here at any time.'; COPY = r.j.copy_url || ''; PICK = '';
  await reload();
}

function proofHtml(){
  const [kind, label] = PROOF[V.status], on = (V.proofs_on_file || {})[kind];
  return '<div class="doc" id="proof"><h3>' + esc(label) + '</h3>' + (on ? '<p style="color:var(--green);font-weight:700">✓ On file. The office checks it.</p>' : '<p class="small">Take a photo, or choose a photo or PDF you already have. Or bring it to the office.</p>')
    + '<div class="pick"><label class="cam">Take a photo<input type="file" accept="image/*" capture="environment" data-kind="' + kind + '" onchange="picked(this)"></label>'
    + '<label>Choose a file<input type="file" accept="image/*,application/pdf" data-kind="' + kind + '" onchange="picked(this)"></label></div><div class="err" id="e_proof"></div></div>';
}
async function picked(input){
  const kind = input.dataset.kind, file = input.files && input.files[0], e = document.getElementById('e_proof');
  const say = (m) => { e.style.display = 'block'; e.textContent = m; };
  if (!file) return; e.style.display = 'none';
  const ct = ctOf(file);
  if (!['image/jpeg', 'image/png', 'image/heic', 'image/webp', 'application/pdf'].includes(ct)) { input.value = ''; return say('Please choose a photo (JPG, PNG, HEIC or WebP) or a PDF.'); }
  if (file.size > MAX_BYTES) { input.value = ''; return say('That file is over 15 MB. Please take a new photo or choose a smaller file.'); }
  busy(true, 'Uploading…');
  try {
    const u = await call({ action: 'upload_url', kind, content_type: ct });
    if (u.status !== 200 || !u.j || !u.j.url || !u.j.path) return say((u.j && u.j.error) || 'The upload could not start. Please try again.');
    let put; try { put = await fetch(u.j.url, { method: 'PUT', headers: { 'Content-Type': ct, 'x-upsert': 'false' }, body: file }); } catch (x) { return say('The upload did not finish. Check your connection and try again.'); }
    if (!put.ok) return say('The upload did not finish. Please try again.');
    const d = await call({ action: 'uploaded', kind, path: u.j.path, content_type: ct });
    if (d.status !== 200 || !d.j || d.j.ok === false) return say((d.j && d.j.error) || 'Your file arrived but could not be recorded. Please try again.');
    MSG = 'Thank you. It is on file and the office will check it.'; COPY = '';
    await reload();
  } finally { busy(false); input.value = ''; }
}
async function reload(){
  const r = await call({ action: 'view' });
  if (r.status !== 200 || !r.j || r.j.ok === false) return dead((r.j && r.j.error) || 'This link is not valid or has run out.');
  V = r.j; render(); const ok = document.getElementById('okmsg'); if (ok) ok.scrollIntoView({ block: 'center' });
}
async function init(){
  if (!LINK.h || !LINK.t) return dead('This link is missing its code.');
  const r = await call({ action: 'view' });
  if (r.status !== 200 || !r.j || r.j.ok === false) return dead((r.j && r.j.error) || 'This link is not valid or has run out.');
  V = r.j; render();
}
init();
</script>
</body>
</html>
