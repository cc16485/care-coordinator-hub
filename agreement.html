<!-- ============================================================
     CLIENT CARE AGREEMENT ON A TABLET, Stage 1 (Samantha 2026-10-16).
     The office opens a client in the Hub and sets the level and rate. The tablet then shows the REAL agreement pages
     (Samantha: "still look like the agreement and just have the fillables"): the office types into the blanks and ticks
     the boxes in place while talking with the family. The family only looks it over, taps the six initials boxes on the
     pages and signs with a finger plus their typed name. The office countersigns and the signed PDF (the real
     agreement pages with everything written in, plus a signature record page) is saved by the client-agreement function.
     The tablet stays signed in as the office person who opened it. Nothing here changes AxisCare or sends anything.
     Field keys are the printed agreement's keys (client-agreement-map.ts on the server).
     874 (Stage 3, Samantha 2026-10-17): SIGNING FROM HOME. Opened from a family's link (sign.html#t=...), the page needs
     no Hub sign-in: it asks for a 6-digit code sent to the phone or email the link went to, then shows the same real
     pages to fill in, initial and sign, through the public agreement-sign door. The office sends the link from the fill
     page ("Send to sign from home") and countersigns in the Hub as usual.
     2026-10-29 (Samantha: "the more they only have to tap the better"): the server fills the typing boxes from AxisCare,
     the Family Circle, the lead and the home visit when the agreement starts (blue boxes to check), the set-up screen picks
     the home visit's level and rate, names are tapped for "Who is signing" and the backup caregiver, numbers open the
     number keypad, and the vehicle boxes are "Not needed" after Decline. Every choice, initial and signature stays a tap.
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{ --navy:#0D365F; --teal:#1F7A8C; --teal-d:#155A68; --pale:#EAF4F6; --honey:#F0A63A; --honey-d:#C17A12; --ink:#16283a; --muted:#55677a; --border:#e4e1d8; --cream:#faf9f6; --panel:#f4f2ec; --red:#a33; --green:#0f7a4d; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:18px; line-height:1.5; }
  header{ background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header b{ font-size:19px; } header .who{ margin-left:auto; font-size:13px; opacity:.85; }
  header a{ color:#fff; font-size:14px; opacity:.85; }
  .steps{ display:flex; gap:6px; padding:12px 20px 0; flex-wrap:wrap; max-width:980px; margin:0 auto; }
  .steps span{ font-size:13px; font-weight:700; padding:5px 12px; border-radius:99px; background:#fff; border:1px solid var(--border); color:var(--muted); }
  .steps span.on{ background:var(--teal); color:#fff; border-color:var(--teal); } .steps span.done{ background:var(--pale); color:var(--teal-d); border-color:var(--pale); }
  main{ max-width:980px; margin:0 auto; padding:16px 20px 120px; }
  h1{ font-size:28px; color:var(--navy); margin:8px 0 4px; } h2{ font-size:21px; color:var(--navy); margin:22px 0 8px; }
  .lead{ color:var(--muted); margin:0 0 16px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin:0 0 14px; }
  .kick{ font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--honey-d); margin:0 0 6px; }
  label{ display:block; font-size:15px; font-weight:700; color:var(--navy); margin:10px 0 4px; }
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select{ width:100%; font:inherit; font-size:18px; padding:12px 14px; border:1.5px solid #cfd6dd; border-radius:12px; background:#fff; color:var(--ink); }
  input:focus{ outline:3px solid var(--pale); border-color:var(--teal); }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:0 16px; } .grid3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:0 16px; }
  .opts{ display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 4px; }
  .pill{ font:inherit; font-size:17px; padding:11px 18px; border-radius:12px; border:1.5px solid #cfd6dd; background:#fff; color:var(--ink); cursor:pointer; min-height:48px; }
  .pill.on{ background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700; }
  .row{ display:grid; grid-template-columns:230px 1fr; gap:10px; align-items:center; padding:6px 0; border-top:1px solid #efece5; }
  .row:first-of-type{ border-top:none; } .row .rl{ font-weight:700; color:var(--navy); font-size:16px; }
  .note{ background:var(--pale); border-left:4px solid var(--teal); border-radius:0 12px 12px 0; padding:12px 14px; font-size:15.5px; margin:10px 0; }
  .btn{ font:inherit; font-size:18px; font-weight:700; border:none; border-radius:14px; padding:14px 24px; min-height:54px; background:var(--teal); color:#fff; cursor:pointer; }
  .btn:hover{ background:var(--teal-d); } .btn.ghost{ background:#fff; color:var(--navy); border:1.5px solid #cfd6dd; } .btn:disabled{ opacity:.5; cursor:default; }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); padding:12px 20px; display:flex; gap:12px; justify-content:space-between; align-items:center; z-index:5; }
  .bar .inner{ max-width:980px; margin:0 auto; width:100%; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .err{ background:#fdf0f0; color:var(--red); border-radius:12px; padding:12px 14px; margin:10px 0; font-size:16px; }
  .err ul{ margin:6px 0 0 18px; padding:0; } .err a{ color:var(--red); }
  .ok{ background:#e8f6ef; color:var(--green); border-radius:12px; padding:12px 14px; margin:10px 0; }
  .pgs{ --s:1; }
  .pg{ position:relative; aspect-ratio:612/792; margin:0 0 16px; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); }
  .pg > img{ display:block; width:100%; height:100%; }
  .f{ position:absolute; margin:0; font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive; color:#0D365F; }
  .ft{ font-size:calc(var(--s) * 10px); line-height:1; padding:0 calc(var(--s) * 2px); border:none; display:flex; align-items:flex-end; white-space:nowrap; overflow:hidden; }
  input.ft{ background:rgba(240,166,58,.16); border-bottom:2px solid var(--honey); border-radius:3px 3px 0 0; color:#0D365F; min-height:0; }
  input.ft:focus{ outline:none; background:rgba(31,122,140,.16); border-bottom-color:var(--teal); }
  .ft.pv{ color:#8a9aaa; }
  /* 2026-10-29: filled in from the Hub, for the family to check (blue), and a vehicle box not needed after "Decline" */
  input.ft.pf{ background:rgba(31,122,140,.13); border-bottom-color:var(--teal); }
  input.ft:disabled{ background:repeating-linear-gradient(135deg,#f1f1ef 0 4px,#fff 4px 8px); border-bottom-color:#d5d9dd; color:#8a9aaa; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; } .chips .pill{ font-size:16px; padding:9px 14px; min-height:46px; }
  .pfkey{ display:inline-block; width:22px; height:14px; vertical-align:middle; background:rgba(31,122,140,.13); border-bottom:2px solid var(--teal); margin-right:6px; }
  /* 874: never wider than the 17pt gap between the closest two boxes, so on a phone they never cover each other */
  .fc{ width:min(30px, calc(var(--s) * 16px)); height:min(30px, calc(var(--s) * 16px)); transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:20px; font-weight:800; color:#0D365F; padding:0; }
  button.fc{ background:rgba(240,166,58,.18); border:2px solid var(--honey); border-radius:min(8px, calc(var(--s) * 3px)); cursor:pointer; font-size:min(20px, calc(var(--s) * 11px)); }
  .zoomtip{ display:none; } @media (max-width:640px){ .zoomtip{ display:block; } }
  button.fc.on{ background:rgba(31,122,140,.15); border-color:var(--teal); }
  .fc.ro{ background:transparent; border:none; }
  .wait{ font-family:inherit; font-size:calc(var(--s) * 7px); color:#9aa6b2; display:flex; align-items:center; justify-content:center; border:1.5px dashed #c5ccd3; border-radius:4px; }
  .tap{ font-family:inherit; font-weight:800; cursor:pointer; border-radius:12px; }
  .fi.tap:not(.on){ transform:translateY(-50%); min-width:140px; min-height:52px; font-size:17px; background:var(--honey); color:#3b2400; border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .fs.tap{ transform:translate(-50%,-50%); min-width:150px; min-height:52px; font-size:17px; background:var(--honey); color:#3b2400; border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .fs.tap{ min-width:200px; }
  .fi.tap.on{ background:rgba(15,122,77,.08); border:2px solid var(--green); color:#0D365F; font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive; font-size:calc(var(--s) * 12px); box-shadow:none; border-radius:4px; padding:0; }
  .flash{ animation:flash 1.6s ease 2; } @keyframes flash{ 0%,100%{ box-shadow:0 0 0 0 rgba(163,51,51,0); } 50%{ box-shadow:0 0 0 8px rgba(163,51,51,.45); } }
  .sheet{ position:fixed; inset:0; background:rgba(13,54,95,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; padding:16px; overflow-y:auto; }
  .sheet .card{ width:100%; max-width:760px; margin:0 auto; }
  .ini-card{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
  .ini-btn{ min-width:190px; } .ini-btn.on{ background:var(--green); }
  .pages{ display:none; margin-top:12px; max-height:70vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; background:#ddd; padding:10px; }
  .pages.on{ display:block; } .pages img{ display:block; width:100%; max-width:820px; margin:0 auto 10px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .sigbox{ border:2px dashed #b9c3cc; border-radius:14px; background:#fff; touch-action:none; width:100%; height:200px; display:block; }
  .contact{ border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin:0 0 12px; background:#fff; }
  .contact summary{ font-weight:800; color:var(--navy); font-size:18px; cursor:pointer; padding:4px 0; }
  .hide{ display:none !important; }
  #gate{ max-width:420px; margin:60px auto; }
  @media (max-width:700px){ .grid,.grid3{ grid-template-columns:1fr; } .row{ grid-template-columns:1fr; } .ini-card{ grid-template-columns:1fr; } }
</style>

<body>
<header><b>Client Care Agreement</b><a href="index.html" id="backLink">← Back to the Hub</a><span class="who" id="who"></span></header>
<div class="steps hide" id="steps"></div>
<main>
  <div id="gate" class="card hide">

    <label for="em">Email</label><input type="email" id="em" autocomplete="username">
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" style="width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid #cfd6dd;border-radius:12px">
    <p><button class="btn" id="signin" type="button">Sign in</button></p><div id="gateErr"></div>
  </div>
  <div id="view"></div>
</main>
<div class="bar hide" id="bar"><div class="inner"><button class="btn ghost" id="backBtn" type="button">Back</button><span id="barMsg" style="font-size:15px;color:var(--muted)"></span><button class="btn" id="nextBtn" type="button">Next</button></div></div>
<script>
(function(){
'use strict';
const SUPA_URL='https://zngsgedlsxinbygwmxwn.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ3NnZWRsc3hpbmJ5Z3dteHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDIzNDQsImV4cCI6MjA5ODExODM0NH0.L_31_UKdccyRH9n7p1GaBlZTqcJipB008H-GIvxwLxM';
const sb=window.supabase.createClient(SUPA_URL,ANON);
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const Q=new URLSearchParams(location.search);
/* 2026-10-17 (the 8-hour weekly minimum): each agreement shows the pages of the master it was started on, found by its
   pdf_sha256. A draft started on an earlier master can't be signed (the server refuses), so it says to start a new one.
   2026-10-18 (Samantha: overtime counted Monday to Sunday): rev-2026-10-18; only page 3 changed.
   2026-10-18b (Samantha: the Booking App terms, signed at the care assessment): rev-2026-10-18b is the current master. Section 9
   is the Booking App (pages 3 to 9 reflowed) and each Exhibit I contact has "Can book in the app" Yes / No (pages 22 and 23). */
const PAGE_DIRS={'a06569407574b49985c0c80fcca149db53904c237b850e874298ba23d66ce3fa':'agreement-pages/rev-2026-10-18b/',
  'ce326142e4593c7caac65cc549e6992af8808eebbaac1f0fcdcababef0b8be11':'agreement-pages/rev-2026-10-18/',
  'b04cd3c1f45930aa1926a63036d8bd44f5091dc71ca7ceff78b0f4a39f5081c3':'agreement-pages/rev-2026-10-17/',
  'd2c6df31fd5bcca031916a31355dfff0321a0c68c4c8445fb41d9ab9350b93f9':'agreement-pages/rev-2026-10/'};
let PAGES_DIR='agreement-pages/rev-2026-10-18b/';
function pagesFor(ag){ const d=ag&&PAGE_DIRS[ag.pdf_sha256]; const want=d||(ag&&ag.pdf_sha256?PAGES_DIR:'agreement-pages/rev-2026-10/'); if(want!==PAGES_DIR){ PAGES_DIR=want; POS=null; } }
const oldDraft=ag=>!!(ag&&ag.status==='draft'&&ag.pdf_sha256&&FORM&&FORM.pdf_sha256&&ag.pdf_sha256!==FORM.pdf_sha256);
let ME={name:'',email:''}, AG=null, FORM=null, A={}, OFFICE={}, PREFILL={}, PFV={}, SIGNER={name:'',role:'',relationship:''}, TAPS={}, step='';
/* 874: opened from a family's link? The secret rides after # so it never reaches a server log. */
/* 2026-10-30: the agreement can start from the lead, before the client is in AxisCare (Samantha: "we need to have a signed
   agreement before we would make them active in AxisCare"); the server moves it to the client once they are set up there */
const WHO=/^\d{1,12}$/.test(Q.get('ax')||'')?{client_ax:Q.get('ax')}:/^[A-Za-z0-9_-]{1,80}$/.test(Q.get('lead')||'')?{lead_id:Q.get('lead')}:{};
const HASH=new URLSearchParams(location.hash.slice(1)), REMOTE=/^[A-Za-z0-9_-]{40,60}$/.test(HASH.get('t')||'')?HASH.get('t'):'';
let SESSION=''; try{ SESSION=sessionStorage.getItem('cag-s-'+REMOTE.slice(0,12))||''; }catch(e){}
const keepSession=v=>{ SESSION=v||''; try{ if(SESSION) sessionStorage.setItem('cag-s-'+REMOTE.slice(0,12),SESSION); else sessionStorage.removeItem('cag-s-'+REMOTE.slice(0,12)); }catch(e){} };

/* ---------- server ---------- */
async function rcall(body){
  /* only Content-Type: the public door's browser check allows exactly that header (874 live fix, 2026-10-17) */
  let r;
  try{ r=await fetch(SUPA_URL+'/functions/v1/agreement-sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body,{t:REMOTE},SESSION?{s:SESSION}:{}))}); }
  catch(e){ throw new Error('We could not reach Caring Companions. Check your internet connection, then try again. Questions? Call us at (417) 234-8494.'); }
  const d=await r.json().catch(()=>null);
  if(!d) throw new Error('We could not reach Caring Companions. Check your internet, then try again.');
  if(r.status>=400){
    if(d.outcome==='need_code'&&step&&step!=='code'){ keepSession(''); remoteStart(); }
    const e=new Error(d.error||'Something went wrong. Please call Caring Companions at (417) 234-8494.'); e.problems=d.problems||[]; e.outcome=d.outcome; throw e;
  }
  return d;
}
async function call(body){
  if(REMOTE) return rcall(body);
  const s=await sb.auth.getSession(), tok=s&&s.data&&s.data.session&&s.data.session.access_token;
  if(!tok) throw new Error('Sign in first.');
  const r=await fetch(SUPA_URL+'/functions/v1/client-agreement',{method:'POST',headers:{Authorization:'Bearer '+tok,apikey:ANON,'Content-Type':'application/json','x-cc-via':'hub'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>null);
  if(!d) throw new Error('The agreement service answered '+r.status);
  if(r.status>=400){ const e=new Error(d.error||('The agreement service answered '+r.status)); e.problems=d.problems||[]; e.outcome=d.outcome; throw e; }
  return d;
}

/* ---------- sign-in ---------- */
if(REMOTE) remoteStart();
else sb.auth.getSession().then(r=>{ if(r.data&&r.data.session) boot(r.data.session); else $('gate').classList.remove('hide'); });

/* ---------- 874: from home, the family proves it is them with a 6-digit code ---------- */
async function remoteStart(){
  $('backLink').classList.add('hide'); $('who').textContent=''; $('bar').classList.add('hide'); step='open';
  try{
    if(SESSION){ try{ const d=await rcall({action:'get'}); return remoteOpen(d); }catch(e){ keepSession(''); } }
    const o=await rcall({action:'open'});
    if(o.state==='signed'){ $('view').innerHTML='<h1>Thank you!</h1><div class="ok" style="font-size:19px">This agreement is already signed. Caring Companions will send you your copy.</div><p class="lead">Questions? Call us at (417) 234-8494.</p>'; return; }
    showCode(o);
  }catch(e){ $('view').innerHTML='<h1>Client Care Agreement</h1><div class="err" style="font-size:18px">'+esc(e.message)+'</div>'; }
}
function showCode(o){
  step='code';
  $('view').innerHTML=`<h1>Hi${o.to_name?' '+esc(String(o.to_name).split(/\s+/)[0]):''}!</h1>
   <p class="lead">This is your Client Care Agreement from Caring Companions. First, we'll send you a 6-digit code to make sure it's you.</p>
   <div class="card">${o.options.map(x=>`<p><button class="btn" type="button" data-via="${esc(x.via)}" style="width:100%">${x.via==='sms'?'Text':'Email'} me a code at ${esc(x.to)}</button></p>`).join('')}
    <div id="codeBox" class="hide"><label for="code">Type the 6-digit code</label><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" style="font-size:28px;letter-spacing:6px;text-align:center">
     <p><button class="btn" type="button" id="codeGo" style="width:100%">Open my agreement</button></p></div>
    <div id="codeMsg"></div></div>
   <p class="lead" style="font-size:16px">Questions? Call us at (417) 234-8494.</p>`;
  $('view').querySelectorAll('[data-via]').forEach(b=>{ b.onclick=async()=>{
    $('codeMsg').innerHTML=''; b.disabled=true;
    try{ const r=await rcall({action:'code',via:b.dataset.via}); $('codeBox').classList.remove('hide'); $('codeMsg').innerHTML='<div class="ok">We sent a code to '+esc(r.to)+'. It works for 10 minutes.</div>'; $('code').focus(); }
    catch(e){ $('codeMsg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
    setTimeout(()=>{ b.disabled=false; },3000);
  }; });
  const go1=async()=>{
    $('codeMsg').innerHTML='';
    try{ const d=await rcall({action:'verify',code:$('code').value}); keepSession(d.s); remoteOpen(d); }
    catch(e){ $('codeMsg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
  };
  $('codeGo').onclick=go1; $('code').onkeydown=e=>{ if(e.key==='Enter') go1(); };
}
async function remoteOpen(d){
  FORM=d.form; AG=d.agreement; A=Object.assign({},AG.answers||{}); OFFICE=(AG.office&&AG.office.answers)||{}; PREFILL=Object.assign({},AG.office&&AG.office.prefill); PFV=Object.assign({},AG.office&&AG.office.prefill_values); pagesFor(AG);
  if(oldDraft(AG)){ $('view').innerHTML='<h1>We updated this agreement</h1><div class="err" style="font-size:18px">This link is for an earlier version of the agreement. Please call or text us at (417) 234-8494 and we\'ll send you a new link.</div>'; return; }
  recallSigner(); if(!SIGNER.name&&d.to_name) SIGNER.name=d.to_name;
  if(AG.status!=='draft'){ $('view').innerHTML='<h1>Thank you!</h1><div class="ok" style="font-size:19px">This agreement is already signed.</div>'; return; }
  await positions(); go('family');
}
$('signin').onclick=async()=>{
  $('gateErr').innerHTML=''; const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){ $('gateErr').innerHTML='<div class="err">'+esc(r.error.message)+'</div>'; return; }
  $('gate').classList.add('hide'); boot(r.data.session);
};
async function boot(session){
  ME.email=(session.user&&session.user.email)||''; $('who').textContent=ME.email;
  try{
    if(Q.get('id')){ const d=await call({action:'get',id:Q.get('id')}); FORM=d.form; await load(d.agreement); }
    else if(/^\d{1,12}$/.test(Q.get('ax')||'')||WHO.lead_id){ FORM=(await call({action:'form'})).form; showOffice(); }
    else $('view').innerHTML='<div class="err">Open this page from a client in the Hub (Start of Care → Client Care Agreement).</div>';
  }catch(e){ $('view').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}
async function load(ag){
  AG=ag; A=Object.assign({},ag.answers||{}); OFFICE=(ag.office&&ag.office.answers)||{}; PREFILL=Object.assign({},ag.office&&ag.office.prefill); PFV=Object.assign({},ag.office&&ag.office.prefill_values); recallSigner(); pagesFor(ag);
  $('backLink').href='index.html';
  if(oldDraft(ag)){ $('view').innerHTML='<div class="err">This agreement was started before the wording was updated on October 17, 2026 (scheduled care now has an 8 hours a week minimum), so it can\'t be signed. Go back to the client and tap <b>Start another</b> to begin a new one.</div>'; return; }
  if(ag.status==='draft'){ await positions(); go('fill'); }
  else if(ag.status==='signed') go('office');
  else if(ag.status==='countersigned') showDone();
  else $('view').innerHTML='<div class="err">This agreement was set aside'+(ag.void_reason?': '+esc(ag.void_reason):'')+'. Start a new one from the client in the Hub.</div>';
}

/* ---------- small helpers for the office set-up screen (data-k = the printed agreement's field key) ---------- */
const val=k=>A[k]==null?'':A[k];
const txt=(k,label,type='text',extra='')=>`<label>${label}</label><input type="${type}" data-k="${k}" value="${esc(val(k))}" ${extra}>`;
const oneOf=(keys,labels)=>keys.map((k,i)=>`<button type="button" class="pill${A[k]===true?' on':''}" data-one="${keys.join(',')}" data-t="${k}">${labels[i]}</button>`).join('');
function wire(root){
  root.querySelectorAll('input[data-k]').forEach(i=>{ i.oninput=()=>{ const v=i.value.trim(); if(v) A[i.dataset.k]=i.value; else delete A[i.dataset.k]; }; });
  root.querySelectorAll('[data-t]').forEach(b=>{ b.onclick=()=>{ const k=b.dataset.t, on=A[k]!==true;
    if(b.dataset.one&&on) b.dataset.one.split(',').forEach(o=>{ delete A[o]; root.querySelectorAll('[data-t="'+o+'"]').forEach(x=>x.classList.remove('on')); });
    if(on) A[k]=true; else delete A[k]; b.classList.toggle('on',on); }; });
}

/* ---------- the real agreement pages, with the blanks fillable in place (Samantha 2026-10-16) ----------
   POS: key -> {type, page, box:[x0,y0,x1,y1]} in PDF points from the top-left of a 612 x 792 page, the same boxes the
   server writes the signed PDF with (agreement-pages/<its master>/fields.json, from the agreement build). */
let POS=null, saveTimer=null;
const OFFICE_KEYS=new Set(['level.wellness_care','level.personal_care','level.advanced_care','level.hourly_rate','rates.wellness_care','rates.personal_care','rates.advanced_care']);
const ONE_OF=[['level.wellness_care','level.personal_care','level.advanced_care'],['car.accept','car.decline'],['comm.accept','comm.decline'],
  ...[1,2,3,4].flatMap(n=>[['c'+n+'.hipaa_yes','c'+n+'.hipaa_no'],['c'+n+'.medical_yes','c'+n+'.medical_no'],['c'+n+'.book_yes','c'+n+'.book_no']])];
const SERVER_ONLY=k=>k.startsWith('ini.')||k.startsWith('sig.')||k.startsWith('ci.sig.')||k.startsWith('date.')||k==='poa.initials'||k==='ci.client_s_name';
const pad2=n=>String(n).padStart(2,'0');
const initials=name=>{ const w=String(name||'').trim().split(/\s+/).filter(Boolean); return w.length?(w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase():''; };
async function positions(){
  if(POS) return POS;
  const r=await fetch(PAGES_DIR+'fields.json',{cache:'no-cache'}); const d=await r.json();
  if(AG&&AG.pdf_sha256?d.pdf_sha256!==AG.pdf_sha256:d.version!==FORM.version) throw new Error('The agreement pages on this tablet do not match this agreement. Tell Samantha.');
  POS=d.fields; return POS;
}
function rememberSigner(){ try{ sessionStorage.setItem('cag-signer-'+AG.id, JSON.stringify(SIGNER)); }catch(e){} }
function recallSigner(){ try{ const s=JSON.parse(sessionStorage.getItem('cag-signer-'+AG.id)||'null'); if(s&&typeof s==='object') SIGNER=Object.assign({name:'',role:'',relationship:''},s); }catch(e){} }

/* what the server writes at signing (dates, printed names), shown as a light preview */
function preview(k){
  const now=new Date(), part=o=>now.toLocaleString('en-US',Object.assign({timeZone:'America/Chicago'},o));
  return ({ 'date.day':part({day:'numeric'}), 'date.month':part({month:'long'}), 'date.year':part({year:'2-digit'}),
    'ci.client_s_name':A['client.client_s_name']||'', 'sig.client.printed_name':SIGNER.name, 'ci.sig.printed_name':SIGNER.name,
    'sig.client.date':part({month:'numeric',day:'numeric',year:'numeric'}), 'ci.sig.date':part({month:'numeric',day:'numeric',year:'numeric'}),
    'sig.admin.printed_name':'', 'sig.admin.date':'' })[k];
}
const at=f=>{ const [x0,y0,x1,y1]=f.box; return `left:${(x0/6.12).toFixed(3)}%;top:${(y0/7.92).toFixed(3)}%;width:${((x1-x0)/6.12).toFixed(3)}%;height:${((y1-y0)/7.92).toFixed(3)}%`; };
const centre=f=>{ const [x0,y0,x1,y1]=f.box; return `left:${((x0+x1)/2/6.12).toFixed(3)}%;top:${((y0+y1)/2/7.92).toFixed(3)}%`; };
/* an initials button starts at the box's left edge and grows into the page margin, so the printed label stays readable */
const startAt=f=>{ const [x0,y0,x1,y1]=f.box; return `left:${(x0/6.12).toFixed(3)}%;top:${((y0+y1)/2/7.92).toFixed(3)}%`; };
/* 2026-10-29: the number keypad for numbers, the email keyboard for emails, so less hunting on a tablet */
const keypad=k=>/phone/.test(k)?'inputmode="tel"':/email/.test(k)?'inputmode="email" autocapitalize="off"':/zip|\.year$|date_of_birth|expiration_date/.test(k)?'inputmode="numeric"':'';
/* the vehicle boxes are "complete if Accept above": after Decline they are not needed */
/* blue while the box still holds what the Hub filled in */
const isPf=k=>!!PREFILL[k]&&String(A[k]||'').trim()!==''&&String(A[k]).trim()===String(PFV[k]==null?'':PFV[k]).trim();
const carOff=k=>k.startsWith('vehicle.')&&A['car.decline']===true;
function carBoxes(){ document.querySelectorAll('input[data-k^="vehicle."]').forEach(i=>{ const off=carOff(i.dataset.k); i.disabled=off; i.placeholder=off?'Not needed':''; }); }
const groupOf=k=>(ONE_OF.find(g=>g.includes(k))||[]).join(',');
function fieldHtml(k,f,mode){
  const off=OFFICE_KEYS.has(k);
  if(f.type==='initials'){
    if(k==='poa.initials'&&SIGNER.role!=='representative') return '';
    const n=k==='poa.initials'?'poa':k.slice(4);
    if(mode==='office') return `<div class="f fi wait" style="${at(f)}" data-key="${k}">initials</div>`;
    return `<button type="button" class="f fi tap${TAPS[n]?' on':''}" style="${TAPS[n]?at(f):startAt(f)}" data-tap="${n}" data-key="${k}">${TAPS[n]?esc(initials(SIGNER.name)):'Tap to initial'}</button>`;
  }
  if(f.type==='signature'){
    if(k==='sig.admin.signature') return '';
    if(mode==='office') return `<div class="f fs wait" style="${at(f)}" data-key="${k}">signs here</div>`;
    return `<button type="button" class="f fs tap" style="${centre(f)}" data-sign="1" data-key="${k}">Tap to sign</button>`;
  }
  const pv=preview(k);
  if(pv!==undefined) return `<div class="f ft pv" style="${at(f)}" data-pv="${k}">${esc(pv)}</div>`;
  if(f.type==='check'){
    const on=(off?OFFICE[k]:A[k])===true;
    if(!off) return `<button type="button" class="f fc${on?' on':''}" style="${centre(f)}" data-t="${k}" data-one="${groupOf(k)}" data-key="${k}" aria-label="${esc(k)}" aria-pressed="${on}">${on?'✓':''}</button>`;
    return `<div class="f fc ro${on?' on':''}" style="${centre(f)}" data-key="${k}">${on?'✓':''}</div>`;
  }
  const v=(off?OFFICE[k]:A[k])||'';
  if(!off) return `<input class="f ft${isPf(k)?' pf':''}" style="${at(f)}" data-k="${k}" data-key="${k}" value="${esc(v)}" aria-label="${esc(k)}" autocomplete="off" ${keypad(k)}${carOff(k)?' disabled placeholder="Not needed"':''}>`;
  return `<div class="f ft ro" style="${at(f)}" data-key="${k}">${esc(off&&k==='level.hourly_rate'?String(v).replace(/^\$/,''):v)}</div>`;
}
function pagesHtml(mode){
  const by={}; for(const [k,f] of Object.entries(POS)) (by[f.page]=by[f.page]||[]).push([k,f]);
  let h='<div class="pgs" id="pgs">';
  for(let p=1;p<=23;p++) h+=`<div class="pg" id="page${p}"><img src="${PAGES_DIR}p${pad2(p)}.jpg" alt="Agreement page ${p}" ${p>2?'loading="lazy"':''}>${(by[p]||[]).map(([k,f])=>fieldHtml(k,f,mode)).join('')}</div>`;
  return h+'</div>';
}
/* the writing on the pages scales with the page */

function showField(k){

   "sometimes the adult kids want to fill it out"). The office fills what it can; the family can type into any blank too. */
/* 2026-10-29: the people on the agreement, to tap instead of typing a name */
function peopleOnIt(){
  const out=[], seen=new Set(), add=(name,rel,role,n)=>{ const nm=String(name||'').trim(), key=nm.toLowerCase().replace(/[^a-z]/g,''); if(!nm||seen.has(key)) return; seen.add(key); out.push({name:nm,rel:String(rel||'').trim(),role,n}); };
  add(A['client.client_s_name'],'','client',0);
  for(const n of [1,2,3,4]) add(A['c'+n+'.name'],A['c'+n+'.relationship'],'representative',n);
  add(A['poa.name'],A['poa.relationship'],'representative',0);
  return out;
}

function vFill(){
  $('bar').classList.remove('hide');
  $('view').innerHTML=`<div class="kick">For the office</div><h1>Fill in the agreement</h1>
   <p class="lead">Type into the blanks and tick the boxes right on the pages as you talk with the family. Fill in as much as you like: the family can also type into any blank when you hand them the tablet.</p>
   ${prefillCard()}${signerCard()}${backupCard()}${homeCard()}${pagesHtml('office')}`;
  fitText(); wireFill(vFill); wireHome(); wirePrefill();
  $('backBtn').style.visibility='hidden'; $('barMsg').textContent='';
  $('nextBtn').textContent='Hand to the family';
  $('nextBtn').onclick=async()=>{ $('barMsg').textContent='Saving…'; if(!await save()) return; $('barMsg').textContent=''; go('handoff'); };
}
/* 2026-10-29: what was filled in from the Hub, and a way to fill the blanks again (a draft from before, or new Family Circle people) */
function prefillCard(){
  const n=Object.keys(PREFILL).filter(isPf).length, notes=(AG.office&&AG.office.prefill_notes)||[];
  return `<div class="card" id="pfCard"><p style="margin:0 0 8px">${n?`<span class="pfkey"></span><b>${n} boxes</b> were filled in from what we already know (AxisCare, the Family Circle, the lead and the home visit). Check them with the family; anyone can change one.`:'Nothing was filled in from the Hub yet.'}</p>
    ${notes.length?'<ul style="margin:0 0 8px 18px;padding:0;font-size:15.5px;color:var(--muted)">'+notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}
    <button type="button" class="btn ghost" id="pfAgain" style="min-height:44px;padding:8px 16px;font-size:16px">Fill in empty boxes from the Hub</button> <span id="pfMsg" style="font-size:15px"></span></div>`;
}
function wirePrefill(){
  $('pfAgain').onclick=async()=>{ const b=$('pfAgain'); b.disabled=true; $('pfMsg').textContent='Looking…';
    try{ if(!(await save())) throw new Error('Not saved first'); const r=await call({action:'fill_blanks',id:AG.id}); const y=window.scrollY;
      AG=r.agreement; A=Object.assign({},AG.answers||{}); PREFILL=Object.assign({},AG.office&&AG.office.prefill); PFV=Object.assign({},AG.office&&AG.office.prefill_values);
      vFill(); window.scrollTo(0,y); $('pfMsg').textContent=r.filled?r.filled+' more filled in.':'Nothing new to fill in.'; }
    catch(e){ $('pfMsg').innerHTML='<span style="color:var(--red)">'+esc(e.message)+'</span>'; b.disabled=false; } };
}
function soon(){ clearTimeout(saveTimer); if(step==='fill') $('barMsg').textContent=''; saveTimer=setTimeout(async()=>{ if((step==='fill'||step==='family')&&await save()&&step==='fill') $('barMsg').textContent='Saved'; },1500); }
async function save(){ clearTimeout(saveTimer); try{ await call({action:'save',id:AG.id,answers:famAnswers()}); if(step==='family') famBar(); return true; }catch(e){ $('barMsg').innerHTML='<span style="color:var(--red)">Not saved: '+esc(e.message)+'</span>'; return false; } }
function famAnswers(){ const o={}; for(const [k,v] of Object.entries(A)) if(!OFFICE_KEYS.has(k)&&!SERVER_ONLY(k)&&FORM.fields[k]&&v!=='') o[k]=v; return o; }
/* the same rules the server checks before anyone may sign (readyToSign) */
function missing(){
  const a=Object.assign({},OFFICE,A), p=[], has=k=>a[k]===true||(typeof a[k]==='string'&&a[k].trim()!==''), need=(k,e)=>{ if(!has(k)) p.push({field:k,error:e}); };
  const nm=SIGNER.name.trim();
  if(nm.length<3||!/\s/.test(nm)) p.push({field:'signer.name',error:'Full name of the person signing'});
  if(!SIGNER.role) p.push({field:'signer.role',error:'Is the client signing, or someone for the client?'});
  need('client.client_s_name',"Client's name"); need('client.address','Address'); need('client.city','City'); need('client.zip','Zip'); need('client.phone_number','Phone number');
  if(SIGNER.role==='representative') need('poa.name','POA name (someone is signing for the client)');
  need('c1.name','Primary contact name'); need('c1.relationship','Primary contact relationship');
  if(!has('c1.cell_phone')&&!has('c1.home_phone')) p.push({field:'c1.cell_phone',error:'A phone number for the primary contact'});
  for(const n of [1,2,3,4]){ if(!has('c'+n+'.name')) continue;
    if(!has('c'+n+'.hipaa_yes')&&!has('c'+n+'.hipaa_no')) p.push({field:'c'+n+'.hipaa_yes',error:'Contact '+n+': may we share health information? Yes or No'});
    if(!has('c'+n+'.medical_yes')&&!has('c'+n+'.medical_no')) p.push({field:'c'+n+'.medical_yes',error:'Contact '+n+': makes medical decisions? Yes or No'});
    if(POS&&POS['c'+n+'.book_yes']&&!has('c'+n+'.book_yes')&&!has('c'+n+'.book_no')) p.push({field:'c'+n+'.book_yes',error:'Contact '+n+': can book in the Booking App? Yes or No'}); }
  need('backup.full_name','Backup caregiver name (required)'); need('backup.primary_phone','Backup caregiver phone');
  if(!Object.keys(a).some(k=>k.startsWith('access.')&&POS[k]&&POS[k].type==='check'&&a[k]===true)) p.push({field:'access.1_client_responsible_party',error:'How caregivers get into the home'});
  if(!has('car.accept')&&!has('car.decline')) p.push({field:'car.accept',error:'Use of my car: Accept or Decline'});
  if(!has('comm.accept')&&!has('comm.decline')) p.push({field:'comm.accept',error:'Permission to communicate: Accept or Decline'});
  if(!['photos.share_with_my_family','photos.marketing','photos.no_photos'].some(k=>a[k]===true)) p.push({field:'photos.share_with_my_family',error:'Photos: pick at least one choice'});
  return p;
}

/* ---------- hand the tablet over ---------- */
function vHandoff(){
  $('bar').classList.add('hide');

   <p><button class="btn" id="famGo" type="button" style="font-size:20px;min-height:60px">Start (for ${who})</button></p>

/* ---------- the family: look it over, type in anything they want, tap the initials, sign ---------- */
const needTaps=()=>[...Object.keys(FORM.initials),...(SIGNER.role==='representative'?['poa']:[])];
function vFamily(){
  const ini=initials(SIGNER.name);
  $('view').innerHTML=`<h1>Your Client Care Agreement</h1>
   <div class="note zoomtip">Tip: on a phone, spread two fingers on the page to zoom in, so the blanks and boxes are easier to tap.</div>
   <p class="lead">Please look it over. ${Object.keys(PREFILL).some(isPf)?'We filled in what we already know (the <span class="pfkey"></span>blue boxes); please check those. ':''}You can type into any blank or change a box if something needs fixing. Then tap each yellow <b>Tap to initial</b> box to put your initials${ini?' (<b>'+esc(ini)+'</b>)':''} on it, and tap <b>Tap to sign</b>.</p>
   ${signerCard()}${backupCard()}${pagesHtml('family')}`;

  $('view').querySelectorAll('[data-tap]').forEach(b=>{ b.onclick=()=>{

    if(TAPS[n]){ delete TAPS[n]; b.classList.remove('on'); b.setAttribute('style',startAt(f)); b.textContent='Tap to initial'; }
    else { TAPS[n]=new Date().toISOString(); b.classList.add('on'); b.setAttribute('style',at(f)); b.textContent=initials(SIGNER.name); }
    famBar();
  }; });
  $('view').querySelectorAll('[data-sign]').forEach(b=>{ b.onclick=()=>signSheet(); });
  famBar();
}
function famBar(){
  const left=needTaps().filter(n=>!TAPS[n]), all=needTaps().length;
  $('barMsg').innerHTML=left.length?`Initials: <b>${all-left.length} of ${all}</b> done`:'<b style="color:var(--green)">All initials done</b>';
  $('nextBtn').textContent=left.length?'Next initials box':'Sign now';
  $('nextBtn').onclick=()=>{ if(left.length) showField(left[0]==='poa'?'poa.initials':'ini.'+left[0]); else signSheet(); };
}
function signSheet(){
  const left=needTaps().filter(n=>!TAPS[n]), blanks=missing();
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='sheet';
  if(blanks.length){
    sh.innerHTML=`<div class="card"><h2 style="margin-top:0">A few things first</h2>${missingHtml(blanks)}<p><button type="button" class="btn ghost" id="shClose">Close</button></p></div>`;
    document.body.appendChild(sh); $('shClose').onclick=()=>sh.remove(); wireGoto(sh,()=>sh.remove()); return;
  }
  if(left.length){
    sh.innerHTML=`<div class="card"><h2 style="margin-top:0">Initials first</h2><p>Please tap the yellow initials boxes first (${left.length} left).</p>
     <p><button type="button" class="btn" id="shNext">Show me the next one</button></p></div>`;
    document.body.appendChild(sh);
    $('shNext').onclick=()=>{ sh.remove(); showField(left[0]==='poa'?'poa.initials':'ini.'+left[0]); };
    return;
  }
  sh.innerHTML=`<div class="card"><h2 style="margin-top:0">Sign the agreement</h2><p style="margin:0 0 10px;color:var(--muted)">Your signature goes on the agreement and on your Contacts &amp; Permissions form.</p>
   <label style="display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:17px;color:var(--ink)"><input type="checkbox" id="consent" style="width:30px;height:30px;flex:none">${esc(FORM.esign_words)}</label>
   <label style="margin-top:14px">Your full name</label><input type="text" id="typed" value="${esc(SIGNER.name)}">
   <label style="margin-top:14px">Sign here with your finger</label><canvas class="sigbox" id="sig"></canvas>
   <p style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" id="clr">Clear</button><span style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" id="shClose">Not yet</button><button type="button" class="btn" id="signBtn">Sign the agreement</button></span></p>
   <div id="signErr"></div></div>`;
  document.body.appendChild(sh);
  const P=pad($('sig'));
  $('sig').addEventListener('pointerdown',()=>{ $('signErr').innerHTML=''; });
  $('clr').onclick=()=>P.clear(); $('shClose').onclick=()=>sh.remove();
  $('signBtn').onclick=async()=>{
    $('signErr').innerHTML='';
    if(!$('consent').checked){ $('signErr').innerHTML='<div class="err">Please tick the box to agree to sign electronically.</div>'; return; }
    if(!P.has){ $('signErr').innerHTML='<div class="err">Please sign with your finger in the box.</div>'; return; }
    const typed=$('typed').value.trim().replace(/\s+/g,' ');
    if(typed.length<3||!/\s/.test(typed)){ $('signErr').innerHTML='<div class="err">Please type your full name.</div>'; return; }
    SIGNER.name=typed; rememberSigner();
    $('signBtn').disabled=true; $('signBtn').textContent='Signing…';
    try{
      await call({action:'sign',id:AG.id,answers:famAnswers(),signer:SIGNER,initials:TAPS,signature:P.png(),consent:true});
      AG.status='signed'; sh.remove(); $('bar').classList.add('hide'); $('backBtn').textContent='Back';
      if(REMOTE){ keepSession(''); $('view').innerHTML='<h1>Thank you!</h1><p class="lead">You have signed your Client Care Agreement.</p><div class="ok" style="font-size:20px">Caring Companions will countersign it and send you your copy. You can close this page.</div><p class="lead">Questions? Call us at (417) 234-8494.</p>'; window.scrollTo(0,0); return; }
      $('view').innerHTML='<h1>Thank you!</h1><p class="lead">You have signed your Client Care Agreement.</p><div class="ok" style="font-size:20px">Please hand the tablet back to the office.</div><p><button class="btn" id="toOffice" type="button">I\'m the office: countersign</button></p>';
      window.scrollTo(0,0); $('toOffice').onclick=()=>go('office');
    }catch(e){
      $('signErr').innerHTML='<div class="err">'+esc(e.message)+problemsHtml(e.problems)+'</div>'; $('signBtn').disabled=false; $('signBtn').textContent='Sign the agreement';
    }
  };
}

/* ---------- finger signature ---------- */
function pad(canvas){
  const st={has:false};
  const size=()=>{ const r=canvas.getBoundingClientRect(), d=window.devicePixelRatio||1; canvas.width=r.width*d; canvas.height=r.height*d; const c=canvas.getContext('2d'); c.scale(d,d); c.lineWidth=2.6; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#0D365F'; st.has=false; };
  size(); let down=false, last=null; const ctx=()=>canvas.getContext('2d');
  const pt=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  canvas.addEventListener('pointerdown',e=>{ down=true; last=pt(e); canvas.setPointerCapture(e.pointerId); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!down) return; const p=pt(e), c=ctx(); c.beginPath(); c.moveTo(last.x,last.y); c.lineTo(p.x,p.y); c.stroke(); last=p; st.has=true; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>canvas.addEventListener(t,()=>{ down=false; }));
  st.clear=size; st.png=()=>canvas.toDataURL('image/png'); return st;
}
function problemsHtml(ps){ return ps&&ps.length?'<ul>'+ps.map(p=>'<li>'+esc(p.error)+'</li>').join('')+'</ul>':''; }

/* ---------- office: countersign, then the signed PDF ---------- */
/* 873 (Samantha 2026-10-16): the family's copy. The countersign screen offers to email it (primary contact, else the POA;
   the office can change the address or untick it); it goes when the office taps Countersign, codes hidden, through
   GoHighLevel. A family who declined email gets no box, only the printed copy. After 6pm it waits for the card's button. */
const EMAIL_OK=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function copyTo(){ for(const [e,n] of [['c1.email','c1.name'],['poa.email','poa.name']]) if(EMAIL_OK.test(String(A[e]||'').trim())) return {to:String(A[e]).trim(),name:String(A[n]||'').trim()}; return {to:'',name:''}; }
function vOffice(){
  const declined=A['comm.decline']===true, d=copyTo();
  const emailBox=declined
    ?'<div class="note">They chose not to get email (Permission to communicate), so no copy is emailed. Print their copy after you countersign.</div>'
    :`<div class="card"><label style="display:flex;gap:12px;align-items:center;font-size:17px;color:var(--ink);margin:0"><input type="checkbox" id="mailCopy" ${d.to?'checked':''} style="width:26px;height:26px;flex:none"> Email the family a copy when I countersign</label>
      <label for="mailTo" style="margin-top:10px">Send it to${d.name?' ('+esc(d.name)+')':''}</label><input type="email" id="mailTo" value="${esc(d.to)}" placeholder="their email" autocomplete="off">
      <div style="font-size:14px;color:var(--muted);margin-top:6px">Their copy has a big "COPY" on it and the lockbox and garage codes are hidden. Emails go between 8am and 6pm.</div></div>`;
  $('view').innerHTML=`<div class="kick">For the office</div><h1>Countersign</h1><p class="lead">You are signing for Caring Companions as <b>${esc(ME.email)}</b>. The signed agreement is saved on the client's record.</p>
  ${emailBox}
  <div class="card"><label>Sign here</label><canvas class="sigbox" id="osig"></canvas>
   <p style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" id="oclr">Clear</button><button type="button" class="btn" id="cBtn">Countersign and save</button></p><div id="cErr"></div></div>`;
  const P=pad($('osig')); $('oclr').onclick=()=>P.clear();
  const mt=$('mailTo'); if(mt) mt.oninput=()=>{ if(mt.value.trim()) $('mailCopy').checked=true; };
  $('cBtn').onclick=async()=>{
    $('cErr').innerHTML='';
    if(!P.has){ $('cErr').innerHTML='<div class="err">Please sign in the box.</div>'; return; }
    const want=!declined&&$('mailCopy')&&$('mailCopy').checked, to=want?$('mailTo').value.trim():'';
    if(want&&!EMAIL_OK.test(to)){ $('cErr').innerHTML='<div class="err">That email address does not look right. Fix it, or untick "Email the family a copy".</div>'; return; }
    $('cBtn').disabled=true; $('cBtn').textContent=want?'Saving and emailing their copy…':'Saving the signed agreement…';
    try{ const r=await call({action:'countersign',id:AG.id,signature:P.png(),email_copy:want?{to}:null}); showDone(r.email||null,declined,r.steps||null); }
    catch(e){ $('cErr').innerHTML='<div class="err">'+esc(e.message)+'</div>'; $('cBtn').disabled=false; $('cBtn').textContent='Countersign and save'; }
  };
}
/* 875 (Stage 4): what the countersign ticked by itself, and the one step that stays a person's (AxisCare can't take documents) */
function stepsNote(st){
  if(!st) return '';
  const bits=[];
  if(st.soc==='ticked') bits.push('Start of Care: "Care Agreement provided" and "Signed Care Agreement received" are ticked.');
  else if(st.soc==='conflict') bits.push('Start of Care was being changed by someone else, so its agreement steps were not ticked: tick them by hand.');
  else if(st.soc==='error') bits.push('Start of Care could not be updated: tick its agreement steps by hand.');
  if(st.journey==='ticked') bits.push('The journey\'s "Service agreement signed and on file" is done.');
  else if(st.journey==='error') bits.push('The journey could not be updated: complete "Service agreement signed and on file" by hand.');
  return (bits.length?'<div class="ok">'+esc(bits.join(' '))+'</div>':'')+'<div class="note"><b>Still yours:</b> open the signed agreement, save it, and upload it in AxisCare (the client, Documents). Then tick "Signed Care Agreement uploaded to AxisCare" on Start of Care.</div>';
}
function showDone(email,declined,steps){
  $('steps').classList.add('hide'); $('bar').classList.add('hide');
  const mail=email?(email.outcome==='sent'?`<div class="ok">Their copy was emailed to ${esc(email.to)}.</div>`:`<div class="err">${esc(email.detail)}</div>`):'';
  $('view').innerHTML=`<h1>Signed and saved</h1><div class="ok">The signed Client Care Agreement is saved on the client's record.</div>${mail}${stepsNote(steps)}
   <p style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="printCopy" type="button">Print the family's copy</button><button class="btn ghost" id="openPdf" type="button">Open the signed agreement</button><a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">Back to the Hub</a></p>
   <div style="font-size:15px;color:var(--muted)">The family's copy has a big "COPY" on every page, to print and hand them.${declined?' They chose not to get email, so this is their copy.':''}</div><div id="dErr"></div>`;
  const opener=(action,btn)=>async()=>{ $('dErr').innerHTML=''; btn.disabled=true; try{ const r=await call({action,id:AG.id}); window.open(r.url,'_blank','noopener'); }catch(e){ $('dErr').innerHTML='<div class="err">'+esc(e.message)+'</div>'; } btn.disabled=false; };
  $('openPdf').onclick=opener('open',$('openPdf')); $('printCopy').onclick=opener('copy_print',$('printCopy'));
}
window.__AG_TEST={ get POS(){return POS;}, get A(){return A;}, get PREFILL(){return PREFILL;}, get TAPS(){return TAPS;}, get SIGNER(){return SIGNER;} };
})();
