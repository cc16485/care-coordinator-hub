<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Visit offer · Caring Companions</title>
<!-- 2026-11-07 (Samantha): Caring Companions no longer offers the Booking App, so family visit offers have ended.
     Old "Can you take it?" links land here. The earlier page is in git history. -->
<style>
  :root{ --navy:#0E3860; --bg:#F6F9FD; --border:#E2E8F0; --gray:#6B7280; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#1f2a36; padding:16px; font-size:17px; line-height:1.45; }
  main{ max-width:520px; margin:0 auto; }
  h1{ font-size:22px; color:var(--navy); margin:6px 0 10px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; }
  .note{ font-size:14px; color:var(--gray); margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>Caring Companions</h1>
  <div class="card">
    <p style="margin:0;font-weight:700;color:var(--navy);">This visit offer is no longer available.</p>
    <p style="margin:10px 0 0;">Please call the office if you have any questions.</p>
    <p class="note">Thank you for all you do.</p>
  </div>
</main>
</body>
</html>
