<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Visit offer · Caring Companions</title>
<!-- ============================================================
     FAMILY VISIT OFFER (Samantha's yes 2026-10-16): a caregiver's own link
     from a "Can you take it?" text. Shows the visit a family booked
     in the family app (client first name, town, day, time or window,
     tasks, the family's note), and Yes / No thanks. A flexible visit:
     they pick the start inside the family's window (only times they
     are free). First yes goes straight on their AxisCare schedule.
     The link (o, e, t) is sealed by the server; nothing else about
     them is in it. Server: family-offer.
     ============================================================ -->
<style>
  :root{ --navy:#0E3860; --teal:#54BDB8; --teal-dark:#1F7A8C; --honey:#FFC671; --bg:#F6F9FD; --border:#E2E8F0; --gray:#6B7280; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#1f2a36; padding:16px; padding-bottom:44px; font-size:17px; line-height:1.45; }
  main{ max-width:520px; margin:0 auto; }
  h1{ font-size:22px; color:var(--navy); margin:6px 0 4px; }
  .sub{ font-size:14px; color:var(--gray); margin-bottom:14px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:0; }
  .row span:first-child{ color:var(--gray); }
  .row b{ text-align:right; color:var(--navy); }
  .q{ font-weight:700; color:var(--navy); margin:4px 0 8px; }
  .times{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .t{ min-height:48px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:16px; font-weight:700; color:var(--navy); cursor:pointer; }
  .t[aria-pressed="true"]{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  button.big{ width:100%; min-height:56px; border-radius:12px; border:0; font-size:18px; font-weight:800; cursor:pointer; margin-top:10px; }
  .yes{ background:var(--teal-dark); color:#fff; }
  .yes[disabled]{ opacity:.5; cursor:default; }
  .no{ background:#fff; color:var(--navy); border:2px solid var(--border) !important; }
  .ok{ background:#E8F6EE; border:1px solid #1E8449; color:#14532d; border-radius:12px; padding:14px; font-weight:700; }
  .info{ background:#FBF0DD; border-radius:12px; padding:14px; font-weight:600; }
  .err{ color:#C0392B; font-size:15px; margin-top:8px; font-weight:600; }
  .note{ font-size:13.5px; color:var(--gray); margin-top:8px; }
  .loading{ color:var(--gray); padding:30px 0; text-align:center; }
  /* 2026-10-25: the client profile, as on the call-in shift page (shift.html) */
  .hero{ border-radius:16px; overflow:hidden; margin:4px 0 10px; background:#EAF4F6; }
  .hero svg{ display:block; width:100%; height:auto; }
  h2.meet{ font-family:Georgia,'Times New Roman',serif; font-size:22px; color:var(--navy); margin:4px 0 6px; }
  .k{ font-size:11.5px; color:var(--gray); text-transform:uppercase; letter-spacing:.07em; font-weight:800; margin-top:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .chips span{ background:#fbf1df; color:#8a5a00; border-radius:999px; padding:4px 11px; font-size:14px; font-weight:700; }
</style>
</head>
<body>
<main id="app"><div class="loading">Loading the visit…</div></main>
<script>
const SUPA_URL = 'https://zngsgedlsxinbygwmxwn.supabase.co'
const QS = new URLSearchParams(location.search)
const LINK = { o: QS.get('o') || '', e: QS.get('e') || '', t: QS.get('t') || '' }
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const t12 = (hhmm) => { const p = String(hhmm || '').split(':'), h = Number(p[0]); return isNaN(h) ? '' : ((h + 11) % 12 + 1) + (p[1] && p[1] !== '00' ? ':' + p[1] : '') + ' ' + (h < 12 ? 'AM' : 'PM') }
const hrs = (n) => (n % 1 ? n.toFixed(1) : n) + ' hours'
const PHONE = '(417) 234-8494'
let V = null, PICK = null, BUSY = false
/* our own illustrations (never a photo), the same scenes as the call-in shift page */
const SCENES = {
  garden: '<svg viewBox="0 0 340 150" aria-hidden="true"><rect width="340" height="150" fill="#EAF4F6"/><circle cx="286" cy="36" r="20" fill="#F0A63A" opacity=".85"/><path d="M0 118 Q90 94 170 112 T340 104 V150 H0Z" fill="#8FD1C7"/><path d="M0 134 Q100 114 190 128 T340 122 V150 H0Z" fill="#1F7A8C"/><g fill="#14606F"><rect x="74" y="92" width="4" height="30"/><rect x="104" y="86" width="4" height="36"/><rect x="134" y="96" width="4" height="26"/></g><circle cx="76" cy="88" r="10" fill="#F0A63A"/><circle cx="106" cy="80" r="12" fill="#E8C988"/><circle cx="136" cy="92" r="9" fill="#F0A63A"/><path d="M210 120 q20-40 40 0z" fill="#14606F"/><circle cx="230" cy="96" r="7" fill="#fff"/></svg>',
  coffee: '<svg viewBox="0 0 340 150" aria-hidden="true"><rect width="340" height="150" fill="#fbf1df"/><rect x="0" y="112" width="340" height="38" fill="#E8C988"/><rect x="120" y="66" width="70" height="50" rx="10" fill="#fff"/><path d="M190 76 q24 0 24 16 t-24 16" fill="none" stroke="#fff" stroke-width="8"/><rect x="130" y="70" width="50" height="10" rx="4" fill="#C17A12" opacity=".7"/><path d="M140 52 q-8-12 0-22 M156 54 q-8-12 0-22 M172 52 q-8-12 0-22" stroke="#8FD1C7" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="268" cy="96" r="20" fill="#1F7A8C" opacity=".25"/><circle cx="62" cy="40" r="16" fill="#F0A63A" opacity=".7"/></svg>',
  porch: '<svg viewBox="0 0 340 150" aria-hidden="true"><rect width="340" height="150" fill="#EAF4F6"/><circle cx="276" cy="38" r="18" fill="#F0A63A" opacity=".85"/><path d="M0 126 Q120 108 240 122 T340 118 V150 H0Z" fill="#8FD1C7"/><rect x="96" y="66" width="104" height="60" rx="4" fill="#fff"/><path d="M84 70 L148 30 L212 70Z" fill="#0D365F"/><rect x="138" y="90" width="20" height="36" rx="2" fill="#C17A12"/><rect x="108" y="80" width="20" height="18" rx="2" fill="#8FD1C7"/><rect x="168" y="80" width="20" height="18" rx="2" fill="#8FD1C7"/><rect x="226" y="104" width="34" height="6" rx="3" fill="#14606F"/><rect x="230" y="110" width="4" height="14" fill="#14606F"/><rect x="252" y="110" width="4" height="14" fill="#14606F"/></svg>',
  sunrise: '<svg viewBox="0 0 340 150" aria-hidden="true"><rect width="340" height="150" fill="#fbf1df"/><circle cx="170" cy="112" r="44" fill="#F0A63A"/><path d="M0 112 H340 V150 H0Z" fill="#1F7A8C"/><path d="M0 124 Q90 110 170 122 T340 118 V150 H0Z" fill="#14606F"/><g stroke="#E8C988" stroke-width="4" stroke-linecap="round"><path d="M170 52 v-16 M120 70 l-12-12 M220 70 l12-12 M98 104 h-16 M242 104 h16"/></g></svg>'
}
/* THE CLIENT PROFILE (Samantha 2026-10-25: "Ideally the app works like the client profiles we are building to use for call
   ins/new client shifts"): the office-approved Caregiver Preview, sent only while app_profile_live is on (v.profile). */
function profileTop(v) {
  const p = v.profile; if (!p) return ''
  return '<div class="hero">' + (SCENES[p.scene] || SCENES.porch) + '</div><h2 class="meet">Meet ' + esc(v.client) + '</h2>'
    + (p.about ? '<p style="margin:6px 0">' + esc(p.about) + '</p>' : '')
    /* 2026-10-25: the family's own words (their work and life, what they love to talk about, the little things) */
    + (p.life || []).map((x) => '<div class="k">' + esc(x.label) + '</div><p style="margin:3px 0">' + esc(x.text) + '</p>').join('')
    + (p.enjoys && p.enjoys.length ? '<div class="k">' + esc(v.client) + ' enjoys</div><div class="chips">' + p.enjoys.map((x) => '<span>' + esc(x) + '</span>').join('') + '</div>' : '')
}
async function call(body) {
  try {
    const r = await fetch(SUPA_URL + '/functions/v1/family-offer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({}, LINK, body)) })
    return await r.json().catch(() => ({ error: 'We could not read the answer. Please try again.' }))
  } catch (e) { return { error: 'Network problem. Please try again.' } }
}
const good = (v) => [...new Set([...(v.home || []), ...((v.profile && v.profile.home) || [])])]
function shell(inner) { $('app').innerHTML = '<h1>Caring Companions</h1>' + inner }
function done(msg, cls) { shell('<div class="' + (cls || 'ok') + '">' + esc(msg) + '</div><p class="note">Questions? Call the office at ' + PHONE + '.</p>') }
function draw(err) {
  const v = V
  // Her approval 2026-10-17 (decision E): an accepted shift is confirmed; changes go through the office, no cancel button here.
  if (v.state === 'yours') {
    done("You're confirmed for " + v.day + ', ' + t12(v.picked || v.start) + '. This is a confirmed shift on your AxisCare schedule. To change it, call the office at ' + PHONE + ' right away, the same as any shift.')
    /* 2026-10-25: the client's photo, only for the caregiver confirmed on the visit, so they know who they're meeting */
    if (v.photo) $('app').insertAdjacentHTML('beforeend', '<div class="card" style="text-align:center"><img src="' + esc(v.photo) + '" alt="Photo of ' + esc(v.client) + '" style="width:160px;height:160px;object-fit:cover;border-radius:14px"><p class="note">This is ' + esc(v.client) + ', so you know who you\'re visiting. Please don\'t save or share this photo.</p></div>')
    return
  }
  if (v.state === 'taken') return done('Someone else took this one. Thank you!', 'info')
  if (v.state === 'cancelled') return done('The family cancelled this visit. Thank you!', 'info')
  if (v.state === 'ended') return done('This visit is no longer needed. Thank you!', 'info')
  const flex = v.kind === 'flex'
  const when = flex ? hrs(v.hours) + ', anytime between ' + t12(v.window_start) + ' and ' + t12(v.window_end) : t12(v.start) + ' to ' + t12(v.end)
  const times = flex ? (v.choices.length
      ? '<div class="q">What time could you start that day?</div><div class="times">' + v.choices.map((c) => '<button class="t" data-pick="' + c + '" aria-pressed="' + (c === PICK) + '">' + t12(c) + '</button>').join('') + '</div>'
      : '<div class="info">You are already working at every start time in this window, so we can\'t put you on this one.</div>')
    : (v.choices.length ? '' : '<div class="info">You are already working then, so we can\'t put you on this one.</div>')
  const can = v.choices.length && (!flex || PICK)
  const choose = v.mode === 'choose'   // Let me choose (her yes 2026-10-16): a yes is interest; the family picks
  if (choose && v.answer === 'interested') return shell('<div class="ok">You\'ve said you\'re interested' + (v.picked ? ' (starting ' + esc(t12(v.picked)) + ')' : '') + '. The family is choosing, and we\'ll text you if they pick you. You\'re not on the schedule unless they do.</div>' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<button class="big no" id="withdraw"' + (BUSY ? ' disabled' : '') + '>I can\'t do it after all</button><p class="note">Questions? Call the office at ' + PHONE + '.</p>')
  shell('<div class="sub">Hi ' + esc(v.first_name || 'there') + '! ' + (choose ? 'A family is choosing a caregiver for a visit they asked for in the Booking App. Interested?' : 'A family asked for a visit in the Booking App. Can you take it?') + '</div>' + profileTop(v) +
    (v.asked_for_you ? '<div class="ok" style="margin-bottom:10px">The family asked for you.</div>' : '') +
    '<div class="card">' +
      '<div class="row"><span>Who</span><b>' + esc(v.client) + (v.town ? ', ' + esc(v.town) : '') + '</b></div>' +
      '<div class="row"><span>When</span><b>' + esc(v.day) + '<br>' + esc(when) + '</b></div>' +
      '<div class="row"><span>Help with</span><b>' + esc((v.tasks || []).join(', ')) + '</b></div>' +
      (v.about && !v.profile ? '<div class="row"><span>About ' + esc(v.client) + '</span><b>' + esc(v.about) + '</b></div>' : '') +
      (v.profile && ((v.profile.needs || []).length || v.profile.level) ? '<div class="row"><span>Skills needed</span><b>' + [v.profile.level ? 'Level ' + v.profile.level : '', ...(v.profile.needs || [])].filter(Boolean).map(esc).join(', ') + '</b></div>' : '') +
      /* Release 3 (her decision 4, 2026-10-17): what to know before saying yes; you decide */
      (good(v).length ? '<div class="row"><span>Good to know</span><b>' + good(v).map(esc).join('. ') + '.</b></div>' : '') +
      (v.note ? '<div class="row"><span>The family says</span><b>' + esc(v.note) + '</b></div>' : '') +
    '</div>' + times +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<button class="big yes" id="yes"' + (can && !BUSY ? '' : ' disabled') + '>' + (BUSY ? 'Saving…' : choose ? 'I\'m available &amp; interested' + (flex && PICK ? ' (start ' + t12(PICK) + ')' : '') : 'I\'ll accept this shift' + (flex && PICK ? ' (start ' + t12(PICK) + ')' : '')) + '</button>' +
    '<button class="big no" id="no"' + (BUSY ? ' disabled' : '') + '>I can\'t this time</button>' +
    '<p class="note">' + (choose ? 'The family sees your profile and picks. If they pick you, it goes on your AxisCare schedule and we text you. The address is in AxisCare once you have it.' : 'Accepting puts this on your AxisCare schedule like any other shift. If something comes up later, call the office right away, the same as any shift. The first caregiver to accept gets it. The address is in AxisCare once you have it.') + '</p>')
}
async function answer(yes) {
  BUSY = true; draw()
  const r = await call({ action: 'answer', yes, start: PICK || undefined })
  BUSY = false
  if (r.error) return draw(r.error)
  if (r.interested) { V = Object.assign({}, V, { answer: 'interested', picked: PICK || V.start }); return draw() }
  done(r.message || 'Thank you!', r.ok && (r.placed || !yes) ? 'ok' : 'info')
}
async function withdraw() {
  BUSY = true; draw()
  const r = await call({ action: 'withdraw' })
  BUSY = false
  if (r.error) return draw(r.error)
  done(r.message || 'Got it. Thank you!', 'info')
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || BUSY) return
  if (b.dataset.pick) { PICK = b.dataset.pick; return draw() }
  if (b.id === 'yes') return answer(true)
  if (b.id === 'no') return answer(false)
  if (b.id === 'withdraw') return withdraw()
})
;(async () => {
  if (!LINK.o || !LINK.e || !LINK.t) return done('This link is not complete. Please open it from the text again, or call the office at ' + PHONE + '.', 'info')
  const r = await call({ action: 'view' })
  if (r.error) return done(r.error, 'info')
  V = r; draw()
})()
</script>
</body>
</html>
