<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Running late · Caring Companions</title>
<!-- ============================================================
     RUNNING LATE (L1, Samantha 2026-09-29): opened from the link in an admin's running-late text. The link is that
     admin's alone, for that one notice, and expires the next day; the server (late-alert) checks it on every tap.
     Opening this page changes nothing: only the buttons do (phones preview links automatically).
     The family is texted ONLY when a person taps "Send to the family" here (her decision 1), only Family Circle
     members who agreed to texts, 6am to 9pm. The client is never texted. (Samantha, 2026-10-03: one tap by a
     person, permanently. There is no automatic family text.)
     432: a notice that came from a CALL shows "Mary said on your 4:31pm call: running late, about 8 minutes (around
     4:39pm)" and their words, and the time reads "from your call".
     ============================================================ -->
<style>
  :root{ --navy:#0E3860; --teal:#54BDB8; --honey:#FFC671; --bg:#F6F9FD; --border:#E2E8F0; --gray:#6B7280; --red:#C0392B; --green:#1E8449; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#1f2a36;
        padding:16px; padding-bottom:40px; max-width:560px; margin-inline:auto; }
  h1{ font-size:20px; color:var(--navy); margin:6px 0 2px; }
  .sub{ font-size:13.5px; color:var(--gray); margin-bottom:14px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .big{ font-size:17px; font-weight:800; color:var(--navy); }
  .late{ display:inline-block; background:#FDECEA; color:var(--red); font-weight:800; font-size:13px; padding:3px 9px; border-radius:99px; margin-top:6px; }
  .done{ background:#E8F6EE; border:1px solid var(--green); color:var(--green); border-radius:12px; padding:12px 14px; font-weight:700; }
  a.call, button{ display:block; width:100%; text-align:center; font-size:16px; font-weight:800; padding:12px; border-radius:11px; border:0;
        cursor:pointer; text-decoration:none; margin-top:8px; }
  a.call{ background:#fff; border:1px solid var(--border); color:var(--navy); }
  .primary{ background:var(--teal); color:#fff; }
  .navy{ background:var(--navy); color:#fff; }
  .ghost{ background:#fff; border:1px solid var(--border); color:var(--navy); }
  .reasons label{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-top:7px;
        font-size:15px; cursor:pointer; }
  .reasons input{ width:20px; height:20px; }
  textarea{ width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-top:8px; font-family:inherit; }
  .note{ font-size:12.5px; color:var(--gray); margin-top:6px; }
  .err{ color:var(--red); font-size:14px; margin-top:8px; font-weight:600; }
  .practice{ background:#FFF6E3; border:1px solid var(--honey); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:10px; }
  h2{ font-size:14px; color:var(--navy); margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  .said{ background:#F1F5F9; border-radius:10px; padding:8px 11px; margin-top:6px; font-size:14.5px; }
  input[type=time]{ font-size:16px; padding:9px 10px; border:1px solid var(--border); border-radius:10px; width:100%; margin-top:6px; }
  .row{ display:flex; gap:8px; } .row > *{ flex:1; }
  .callbox{ background:#EEF7F6; border-color:var(--teal); }
  .callline{ font-size:16px; font-weight:800; color:var(--navy); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
</style>
<script src="office-call.js?v=433"></script>
</head>
<body>
<h1>Running late</h1>
<div class="sub" id="who">Caring Companions</div>
<div id="app"><div class="card">Loading…</div></div>
<script>
const SUPA_URL='https://zngsgedlsxinbygwmxwn.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ3NnZWRsc3hpbmJ5Z3dteHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDIzNDQsImV4cCI6MjA5ODExODM0NH0.L_31_UKdccyRH9n7p1GaBlZTqcJipB008H-GIvxwLxM';
const P=Object.fromEntries(new URLSearchParams(location.search));
const LINK={ c:P.c||'', a:P.a||'', e:Number(P.e||0), t:P.t||'' };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel=p=>String(p||'').replace(/[^\d+]/g,'');
const pretty=p=>{ const d=String(p||'').replace(/\D/g,'').slice(-10); return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):String(p||''); };
let D=null, busy=false;
/* 433: "Call" rings this admin's phone first (the link names the admin); office-call.js shows what happened */
window.ocBridge=(target)=>call('bridge',{ target });
async function call(action, extra){
  const r=await fetch(SUPA_URL+'/functions/v1/late-alert',{ method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:ANON, Authorization:'Bearer '+ANON },
    body:JSON.stringify(Object.assign({}, LINK, { action }, extra||{})) });
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||('Something went wrong ('+r.status+').'));
  return j;
}
function render(msg){
  const app=document.getElementById('app');
  if(!D){ app.innerHTML='<div class="card"><div class="err">'+esc(msg||'This link is not valid.')+'</div></div>'; return; }
  document.getElementById('who').textContent='For '+D.me+' · Caring Companions';
  const F=D.family||{}; let h='';
  if(D.practice) h+='<div class="practice">Practice run: this notice was found while running-late is in practice. Nothing is sent from here yet.</div>';
  if(D.call) h+='<div class="card callbox"><h2>From the call</h2><div class="callline">'+esc(D.call.line)+'</div>'
    +(D.call.quote?'<div class="said">"'+esc(D.call.quote)+'"<div class="note">'+esc(D.caregiver_first)+'\'s words on the call</div></div>':'')
    +(D.call.missed_clockin_paused_until?'<div class="note">The missed clock-in texts to the admins are paused until '+esc(D.call.missed_clockin_paused_until)+'. If there\'s still no clock-in then, they start again.</div>':'')
    +'</div>';
  h+='<div class="card"><div class="big">'+esc(D.caregiver_first)+' · '+esc(D.client_first)+'\'s '+esc(D.shift_time)+' shift</div>'
    +'<span class="late">'+(D.kind==='cant_make_it'?'Can\'t make it':(D.eta?'Running late, expected about '+esc(D.eta):'Running late, no time given yet'))+'</span>'
    +(D.eta&&D.eta_by?'<div class="note">Time '+esc(D.eta_by)+'.</div>':'')
    +(D.sure===false?'<div class="note">The Hub wasn\'t sure which visit this is, or the message was unclear. Check with '+esc(D.caregiver_first)+'.</div>':'')
    +'<div style="margin-top:10px;"><h2>What '+esc(D.caregiver_first)+' said</h2>'+(D.said||[]).map(s=>'<div class="said">'+esc(s.text)+'<div class="note">'+(s.channel==='call'?'Call':'Text')+' at '+esc(s.at)+'</div></div>').join('')+'</div></div>';
  if(D.closed) h+='<div class="done">'+(D.closed.how==='clocked_in'?esc(D.caregiver_first)+' clocked in'+(D.closed.clock_in?' at '+esc(D.closed.clock_in):'')+'.':D.closed.how==='coverage_case'?'A coverage case has this shift now.':'This notice is closed.')+'</div>';
  if(!D.closed){
    h+='<div class="card">'+(D.seen?'<div class="done">Seen by '+esc(D.seen.by)+' at '+esc(D.seen.at)+'.</div>':'<button class="primary" id="bSeen">Seen</button><div class="note">Stops the reminder texts for every admin.</div>')
      +(D.kind==='late'?'<h2 style="margin-top:12px;">Change the time</h2><div class="note">If they told you a different time on the phone, or the Hub read it wrong.</div><div class="row"><input type="time" id="eta" value="'+esc(D.eta_hhmm||'')+'"><button class="ghost" id="bEta" style="margin-top:6px;">Save time</button></div>':'')
      +(D.kind==='cant_make_it'?'<button class="navy" id="bCov">Open a coverage case</button><div class="note">The call-in process takes the shift from there.</div>':'')
      +'</div>';
  }
  if(D.kind==='late'){
    h+='<div class="card"><h2>'+esc(D.client_first)+'\'s family</h2>';
    (F.sent||[]).forEach(s=>{ h+='<div class="done" style="margin-top:6px;">'+(s.what==='arrived'?'Told they arrived':s.what==='update'?'Update sent':'Told')+' by '+esc(s.by)+' at '+esc(s.at)+' ('+esc(s.count)+' '+(s.count===1?'person':'people')+').</div>'; });
    if(F.skipped) h+='<div class="note">'+esc(F.skipped.by)+' chose not to tell the family ('+esc(F.skipped.at)+').</div>';
    if(F.can){
      h+='<div class="note" style="margin-top:6px;">Goes to '+esc((F.first_names||[]).join(', '))+' (Family Circle, agreed to texts). Each text starts "Hi '+esc((F.first_names||['there'])[0])+'," with their own name.</div>'
        +'<textarea id="famText" rows="4" maxlength="600">'+esc(F.draft||'')+'</textarea>'
        +(F.hours_ok===false?'<div class="note"><b>Family texts go '+esc(F.hours||'6am to 9pm')+'.</b> It\'s outside those hours now, so nothing can be sent. Call the family instead if it can\'t wait.</div>':'')
        +'<button class="primary" id="bFam"'+(F.hours_ok===false?' disabled':'')+'>'+(F.is_update?'Send the update to the family':'Send to the family')+'</button>'
        +'<div class="note">Only when you tap. '+esc(D.client_first)+' is never texted.</div>'
        +(!(F.sent||[]).length&&!F.skipped?'<button class="ghost" id="bSkip">Don\'t tell the family</button>':'');
    } else if(!F.arrived_can && !(F.sent||[]).length) h+='<div class="note">The family can\'t be texted from here: '+esc(F.why||'')+'.</div>';
    if(F.arrived_can) h+='<textarea id="arrText" rows="2" maxlength="600">'+esc(F.arrived_draft||'')+'</textarea><button class="primary" id="bArr">Tell the family '+esc(D.caregiver_first)+' arrived</button>';
    h+='</div>';
  }
  h+='<div class="card"><h2>Call</h2>'
    /* 431: calls go from the office line; 433: the tap rings your phone first (GoHighLevel call bridge), the browser and the cell stay as backups (office-call.js) */
    +((D.caregiver_phone||D.caregiver_ghl)?ocInline(D.caregiver_phone,'Call '+D.caregiver_first,D.caregiver_ghl&&Object.assign({ name:D.caregiver_first },D.caregiver_ghl),null,'caregiver'):'<div class="note">No phone for '+esc(D.caregiver_first)+' on the roster.</div>')
    +((D.client_phone||D.client_ghl)?ocInline(D.client_phone,'Call '+D.client_first+'\'s home',D.client_ghl&&Object.assign({ name:D.client_first },D.client_ghl),null,'client')+'<div class="note">The client is never texted by this. A call is yours to make.</div>':'')
    +'</div><div class="err" id="err">'+esc(msg||'')+'</div>';
  app.innerHTML=h;
  const on=(id,fn)=>{ const b=document.getElementById(id); if(b) b.onclick=fn; };
  on('bSeen', ()=>act('seen'));
  on('bEta', ()=>act('eta', ()=>{ const v=(document.getElementById('eta')||{}).value||''; if(!v) throw new Error('Pick a time first.'); return { hhmm:v }; }));
  on('bCov', ()=>act('coverage', null, 'Open a coverage case for this shift? The call-in process takes it from there.'));
  on('bFam', ()=>act('family', ()=>{ const t=((document.getElementById('famText')||{}).value||'').trim(); if(!t) throw new Error('The text is empty.'); return { text:t }; }, 'Text '+(F.first_names||[]).join(', ')+' now?'));
  on('bSkip', ()=>act('skip'));
  on('bArr', ()=>act('arrived', ()=>({ text:((document.getElementById('arrText')||{}).value||'').trim() }), 'Tell the family '+D.caregiver_first+' arrived?'));
}
function confirmBox(q){ return new Promise(res=>{ const e=document.getElementById('err'); e.innerHTML='<div class="card" style="margin-top:10px;"><div style="font-weight:700;color:var(--navy);">'+esc(q)+'</div><button class="primary" id="cYes">Yes</button><button class="ghost" id="cNo">Cancel</button></div>';
  document.getElementById('cYes').onclick=()=>{ e.innerHTML=''; res(true); }; document.getElementById('cNo').onclick=()=>{ e.innerHTML=''; res(false); }; }); }
async function act(action, extraFn, ask){
  if(busy) return; let extra={};
  try{ extra=extraFn?extraFn():{}; }catch(e){ document.getElementById('err').textContent=e.message; return; }
  if(ask && !(await confirmBox(ask))) return;
  busy=true;
  try{ const j=await call(action, extra); D=await call('view');
    render(j&&j.already?(j.already.by?'Already seen by '+j.already.by+'.':'Already done.'):(j&&j.count?'Sent to '+j.count+'.':(j&&j.others_told?'Done. The other admins were told.':''))); }
  catch(e){ const el=document.getElementById('err'); if(el) el.textContent=e.message; }
  busy=false;
}
(async()=>{ try{ D=await call('view'); render(); }catch(e){ D=null; render(e.message); } })();
</script>
</body>
</html>
