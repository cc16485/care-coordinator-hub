# Rules guard (2026-10-18): a PR that changes a rules file the server runs stays red until that exact file is approved
# (Desktop "approve the new rules" step). See tools/rules-guard.mjs.
name: Rules files approved
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rules-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # the default ref is the PR merged into main, so the check sees exactly what merging would put live
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Every changed rules file is approved
        run: node tools/rules-guard.mjs "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
