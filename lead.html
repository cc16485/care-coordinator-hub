<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>New inquiry · Caring Companions</title>
<!-- ============================================================
     SPEED TO LEAD (item 2 of her Leads design, Samantha "yes to all" 2026-10-07): opened from the link in a
     speed-to-lead text (5 minutes: the owner; 15: the backup; 30: Owner Escalation). The link is that person's alone,
     for that one inquiry, and expires the day after; the server (lead-watch) checks it on every tap. Opening this page
     changes nothing: only the buttons do. Call rings your phone first (the office line). "Called" logs the attempt as
     you, which stops the clock. Take it makes the inquiry yours. The family is never texted from here.
     Built like the missed clock-in and call-in pages.
     ============================================================ -->
<style>
  :root{ --navy:#0E3860; --teal:#54BDB8; --honey:#FFC671; --bg:#F6F9FD; --border:#E2E8F0; --gray:#6B7280; --red:#C0392B; --green:#1E8449; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#1f2a36;
        padding:16px; padding-bottom:40px; max-width:560px; margin-inline:auto; }
  h1{ font-size:20px; color:var(--navy); margin:6px 0 2px; }
  .sub{ font-size:13.5px; color:var(--gray); margin-bottom:14px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .big{ font-size:17px; font-weight:800; color:var(--navy); }
  .late{ display:inline-block; background:#FDECEA; color:var(--red); font-weight:800; font-size:13px; padding:3px 9px; border-radius:99px; margin-top:6px; }
  .ok{ display:inline-block; background:#E8F6EE; color:var(--green); font-weight:800; font-size:13px; padding:3px 9px; border-radius:99px; margin-top:6px; }
  .done{ background:#E8F6EE; border:1px solid var(--green); color:var(--green); border-radius:12px; padding:12px 14px; font-weight:700; }
  a.call, button{ display:block; width:100%; text-align:center; font-size:16px; font-weight:800; padding:12px; border-radius:11px; border:0;
        cursor:pointer; text-decoration:none; margin-top:8px; font-family:inherit; }
  a.call{ background:#fff; border:1px solid var(--border); color:var(--navy); }
  .primary{ background:var(--teal); color:#fff; }
  .navy{ background:var(--navy); color:#fff; }
  .ghost{ background:#fff; border:1px solid var(--border); color:var(--navy); }
  .reasons label{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-top:7px; font-size:15px; cursor:pointer; }
  .reasons input{ width:20px; height:20px; }
  textarea{ width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-top:8px; font-family:inherit; }
  .note{ font-size:12.5px; color:var(--gray); margin-top:6px; }
  .err{ color:var(--red); font-size:14px; margin-top:8px; font-weight:600; }
  .practice{ background:#FFF6E3; border:1px solid var(--honey); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:10px; }
  .said{ background:#F1F5F9; border-radius:10px; padding:8px 11px; margin-top:8px; font-size:14.5px; }
  h2{ font-size:14px; color:var(--navy); margin:0 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  .k{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--gray); margin-top:8px; }
</style>
<script src="office-call.js?v=433"></script>
</head>
<body>
<h1>New inquiry</h1>
<div class="sub" id="who">Caring Companions</div>
<div id="app"><div class="card">Loading…</div></div>
<script>
const SUPA_URL='https://zngsgedlsxinbygwmxwn.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ3NnZWRsc3hpbmJ5Z3dteHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDIzNDQsImV4cCI6MjA5ODExODM0NH0.L_31_UKdccyRH9n7p1GaBlZTqcJipB008H-GIvxwLxM';
const P=Object.fromEntries(new URLSearchParams(location.search));
const LINK={ c:P.c||'', a:P.a||'', e:Number(P.e||0), t:P.t||'' };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, busy=false;
async function call(action, extra){
  const r=await fetch(SUPA_URL+'/functions/v1/lead-watch',{ method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:ANON, Authorization:'Bearer '+ANON },
    body:JSON.stringify(Object.assign({}, LINK, { action }, extra||{})) });
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||('Something went wrong ('+r.status+').'));
  return j;
}
/* Call rings your phone first (the office line), from the server's bridge; the cell stays a fallback (office-call.js) */
window.ocBridge=()=>call('bridge');
function render(msg){
  const app=document.getElementById('app');
  if(!D){ app.innerHTML='<div class="card"><div class="err">'+esc(msg||'This link is not valid.')+'</div></div>'; return; }
  document.getElementById('who').textContent='For '+D.me+' · Caring Companions';
  let h='';
  if(D.practice) h+='<div class="practice">Practice: the speed-to-lead texts are not switched on yet. The buttons still work.</div>';
  h+='<div class="card"><div class="big">'+esc(D.family)+(D.client&&D.client!==D.family?' · for '+esc(D.client):'')+(D.relationship?' <span style="font-weight:500;color:var(--gray);">('+esc(D.relationship)+')</span>':'')+'</div>'
    +'<div class="note">Came in '+esc(D.came_in.replace(/^came in /,''))+(D.source?' · '+esc(D.source):'')+(D.referral?' · '+esc(D.referral):'')+(D.ack?' · '+esc(D.ack):'')+'</div>'
    +(D.attempted?'<span class="ok">'+(D.talked?'Reached':'Tried')+(D.last_try?': '+esc(D.last_try.by)+' '+esc(D.last_try.outcome)+(D.last_try.at?' at '+esc(D.last_try.at):''):'')+'</span>'
      :'<span class="late">'+esc(D.open_minutes)+' min, nobody has called</span>')
    +(D.what?'<div class="k">They wrote</div><div class="said">'+esc(D.what)+'</div>':'')
    +(D.need?'<div class="k">What they need</div><div style="font-size:14.5px;margin-top:4px;">'+esc(D.need)+'</div>':'')
    +'<div class="k">Owner</div><div style="font-size:14.5px;margin-top:4px;">'+(D.owner?esc(D.owner)+(D.mine?' (you)':''):'<span style="color:var(--red);font-weight:700;">Nobody</span>')+'</div>'
    +(D.do_not_contact?'<div class="err">This family asked us not to contact them. Call only if they asked for the call.</div>':'')
    +'</div>';
  h+='<div class="card"><h2>Call</h2>'
    +(D.phone?ocInline(D.phone,'Call '+D.first,{ name:D.first, app_url:'https://app.leadconnectorhq.com/', web_url:'' },null,'client'):'<div class="note">No phone number on the inquiry.'+(D.email?' Email: '+esc(D.email):'')+'</div>')
    +'</div>';
  h+='<div class="card"><h2>What happened?</h2><div class="reasons">'
    +[['connected','We talked'],['voicemail','Voicemail'],['no_answer','No answer'],['wrong_number','Wrong number']].map(o=>'<label><input type="radio" name="why" value="'+o[0]+'"> '+o[1]+'</label>').join('')
    +'</div><textarea id="note" rows="2" maxlength="300" placeholder="Anything worth remembering? (optional)"></textarea>'
    +'<button class="primary" id="bCalled">Log the call</button>'
    +'<div class="note">Logging the call is what stops the clock for everyone. It goes on the inquiry as you.</div></div>';
  h+='<div class="card">'
    +(D.mine?'<div class="note">This inquiry is yours.</div>':'<button class="navy" id="bTake">Take it'+(D.owner?' from '+esc(D.owner):'')+'</button><div class="note">It becomes yours: on your My Work and the Leads board, with the history kept.</div>')
    +'<a class="call" href="'+esc(D.hub_url)+'">Open in the Hub</a>'
    +'</div><div class="err" id="err">'+esc(msg||'')+'</div>';
  app.innerHTML=h;
  const on=(id,fn)=>{ const b=document.getElementById(id); if(b) b.onclick=fn; };
  on('bCalled', ()=>act('called', ()=>{ const w=document.querySelector('input[name=why]:checked'); if(!w) throw new Error('Pick what happened first.'); return { outcome:w.value, note:(document.getElementById('note')||{}).value||'' }; }));
  on('bTake', ()=>act('take'));
}
async function act(action, extraFn){
  if(busy) return; let extra={};
  try{ extra=extraFn?extraFn():{}; }catch(e){ document.getElementById('err').textContent=e.message; return; }
  busy=true;
  try{ const j=await call(action, extra); D=await call('view'); render(action==='take'?'It\'s yours now.':(j&&j.first_attempt?'Logged. The clock has stopped.':'Logged.')); }
  catch(e){ const el=document.getElementById('err'); if(el) el.textContent=e.message; }
  busy=false;
}
(async()=>{ try{ D=await call('view'); render(); }catch(e){ D=null; render(e.message); } })();
</script>
</body>
</html>
