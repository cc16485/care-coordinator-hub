/* ───── the preview's stand-in for the server: only the words, the required-answer check and the PDF come from the server's

let PSIGN = {};
const PCALL = async (b) => { const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON }, body: JSON.stringify({ action: 'preview', ...b }) }); let j = {}; try { j = await r.json(); } catch (e) {} return { status: r.status, j }; };
const identLast4 = () => ({ ssn: IDENT.ssn ? String(IDENT.ssn).slice(-4) : null, dob: !!IDENT.dob, license: IDENT.license ? String(IDENT.license).slice(-4) : null });
async function previewCall(b){
  const ok = (j) => ({ status: 200, j: { ok: true, ...j } });
  if (b.action === 'view') return PCALL({});
  if (b.action === 'begin' || b.action === 'save') return ok({});
  if (b.action === 'copies') return ok({ copies: {} });
  if (b.action === 'identity') {
    const d = (x) => String(x || '').replace(/\D/g, '');
    if (b.ssn != null) { if (d(b.ssn) !== d(b.ssn2)) return { status: 400, j: { error: 'The two Social Security numbers do not match. Please type it twice, digits only.' } }; if (d(b.ssn).length !== 9) return { status: 400, j: { error: 'That does not look like a Social Security number. Please check it. For a practice or training hire, use 987-65-4321 (a number never issued to anyone).' } }; IDENT.ssn = 'ending ' + d(b.ssn).slice(-4); }
    if (b.dob != null) { if (!/^\d{4}-\d{2}-\d{2}$/.test(b.dob)) return { status: 400, j: { error: 'Please enter your date of birth as a full date (you must be at least 16).' } }; IDENT.dob = true; }
    if (b.license_number != null) { const l = String(b.license_number).replace(/\s+/g, '').toUpperCase(); if (!/^[A-Z0-9-]{4,20}$/.test(l)) return { status: 400, j: { error: 'Please enter the license number as it appears on the card (letters and numbers).' } }; IDENT.license = 'ending ' + l.slice(-4); }

    const applies = (k) => { const w = (FORMS[k] || {}).when; return !w || ANS[w.id] === w.equals; };
    const before = V.order.slice(0, V.order.indexOf(b.form)).filter((k) => applies(k) && !SIGS[k]);
    if (before.length) return { status: 409, j: { error: 'Please sign ' + FORMS[before[0]].title + ' first; the forms go in order.' } };

async function previewPdf(form){
