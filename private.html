<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0D365F">
<title>Message the owners · Caring Companions</title>
<!-- ============================================================
     OWNERS ONLY (Samantha 2026-11-14). A private message to Samantha and Zach, and their private replies.
     Three ways in, no sign-in and no portal:
       private.html#k=<code>   from a check-in or any personal smart link: we already know who they are, so nothing is asked twice.
       private.html            the standalone link (website, handbook, texts): they give a name and a phone or email.
       private.html#r=<code>   a reply from an owner: a one-time code goes to the phone or email we have on file first,
                               then the conversation shows for 15 minutes. The reply link itself lasts 7 days.
     Codes sit after the # so the web host never receives them. Message words are never in a link, a text or an email:
     the text or email only says a private reply is waiting.
     Server (function owner-inbox, not built yet): messages are stored where only the owner role (Samantha, Zach) can read
     them. Coordinators, Ask Cara, reports and the Check-ins tab cannot see them, their count, or that they exist.
     DESIGN STAGE: only ?demo=family|caregiver|staff|standalone|reply works. Nothing is saved or sent.
     ============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D365F;--teal:#1F7A8C;--honey:#F0A63A;--cream:#faf9f6;--ink:#2b3a47;--soft:#EAF4F6;--line:#e4e8ea;--muted:#6b7a86;--card:#fff;--rose:#B5473A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);font-family:'Poppins',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:700}
.frame{max-width:430px;margin:0 auto;background:var(--cream);min-height:100vh}
@media(min-width:700px){body{padding:24px 0}.frame{border-radius:28px;overflow:hidden;min-height:auto}}
.sample{background:#08243f;color:#fff;font-size:13px;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample b{color:#FBD38D}.sample select{font:inherit;font-size:13px;border-radius:8px;border:0;padding:4px 6px}
header{background:var(--navy);color:#fff;padding:18px 18px 22px}
header .logo{height:36px;display:block;background:#fff;border-radius:10px;padding:4px 8px}
header .lock{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:#FBD38D}
header h1{font-size:25px;line-height:1.2;margin-top:10px}
header p{font-size:15px;color:#cfdbe6;margin-top:6px}
main{padding:16px 16px 28px}
.card{background:var(--card);border-radius:20px;padding:18px 16px;border:1px solid var(--line);margin-bottom:12px}
.q{font-size:17px;font-weight:600;color:var(--navy)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:15px;display:flex;gap:10px;align-items:center}
.opt .e{font-size:20px}.opt.on{border-color:var(--teal);background:var(--soft);color:var(--navy);font-weight:600}
textarea,input[type=text],input[type=tel],input[type=email]{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-top:10px}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.as{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--navy)}
.as a{color:var(--teal);font-weight:600;font-size:13px}
.go{display:block;width:100%;font:inherit;font-size:17px;font-weight:600;color:#fff;background:var(--navy);border:0;border-radius:16px;padding:15px;cursor:pointer}
.err{color:var(--rose);font-size:13px;margin-top:8px;display:none}
.promise{font-size:13px;color:var(--muted);margin:14px 4px 0;line-height:1.5}
.promise b{color:var(--navy)}
.safety{background:#FDF1EF;border:1px solid #F3C9C2;color:#7a2c22;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.done{text-align:center;padding:26px 14px}.done .big{font-size:52px}.done h2{font-size:23px;color:var(--navy);margin-top:10px}.done p{font-size:15px;color:var(--muted);margin-top:8px}
.code{display:flex;gap:8px;justify-content:center;margin-top:14px}
.code input{width:44px;height:54px;text-align:center;font-size:22px;font-weight:600;padding:0;margin:0}
.msg{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.msg .who{font-size:12px;font-weight:600;margin-bottom:4px}
.msg.me{background:#fff;border:1px solid var(--line);margin-left:28px}
.msg.me .who{color:var(--muted)}
.msg.owner{background:var(--soft);margin-right:28px}
.msg.owner .who{color:var(--teal)}
.timer{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 12px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.foot a{color:var(--teal);font-weight:600;text-decoration:none}
</style></head>
<body><div class="frame">
<div class="sample" id="sample" hidden><b>Sample</b> nothing is saved or sent
  <select id="sWho" aria-label="How they arrived"><option value="family">Family, from a check-in link</option><option value="caregiver">Caregiver, from a check-in link</option><option value="staff">Office staff, from the Hub</option><option value="standalone">Standalone link</option><option value="reply">A reply from an owner</option></select>
</div>
<header><img class="logo" src="cc-logo.png" alt="Caring Companions"><span class="lock">🔒 Owners only</span>
<h1 class="serif" id="h1">Message the owners</h1><p id="lead">Only Samantha and Zach will read this. It does not go to your coordinator.</p></header>
<main id="main"></main>
</div>
<script>
const OFFICE = '(417) 234-8494', OFFICE_TEL = 'tel:+14172348494';
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo');
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SAMPLE = {
  family: { known: true, first: 'Linda', name: 'Linda S.', about: "Dorothy's daughter", phone_tail: '42', email: 'l•••@gmail.com' },
  caregiver: { known: true, first: 'Rachel', name: 'Rachel M.', about: 'Caregiver', phone_tail: '17' },
  staff: { known: true, first: 'Krystal', name: 'Krystal L.', about: 'Office team', phone_tail: '05', staff: true },
  standalone: { known: false },
};
const KINDS = [['concern', '💬', 'A concern'], ['idea', '💡', 'A suggestion'], ['thanks', '💛', 'Thanks for someone'], ['sensitive', '🔒', 'Something sensitive']];
let who = null, M = {};

function compose() {
  M = {};
  $('#h1').textContent = who.known ? 'Hi ' + who.first + ', message the owners' : 'Message the owners';
  $('#lead').textContent = 'Only Samantha and Zach will read this. ' + (who.staff ? 'It does not go to anyone else in the office.' : 'It does not go to your coordinator.');
  let h = '<div class="safety">If someone is in danger right now, call 911.</div>';
  h += '<div class="card"><p class="q">What would you like to share?</p><div class="opts" data-f="kind">'
    + KINDS.map(([v, e, t]) => '<button class="opt" data-v="' + v + '"><span class="e" aria-hidden="true">' + e + '</span>' + t + '</button>').join('') + '</div>'
    + '<textarea id="body" placeholder="Write as much or as little as you like" maxlength="4000"></textarea></div>';
  if (who.known) h += '<div class="card"><div class="as"><span>Sending as <b>' + esc(who.name) + '</b> · ' + esc(who.about) + '</span><a href="#" id="notme">Not you?</a></div>';
  else h += '<div class="card"><p class="q">Who is this from?</p><p class="hint">So an owner can get back to you.</p>'
    + '<input type="text" id="nm" placeholder="Your name" autocomplete="name">'
    + '<div class="opts" data-f="role" style="grid-template-columns:1fr 1fr"><button class="opt" data-v="family">Client or family</button><button class="opt" data-v="caregiver">Caregiver</button><button class="opt" data-v="staff">Office team</button><button class="opt" data-v="other">Someone else</button></div>'
    + '<input type="tel" id="ph" placeholder="Phone" inputmode="tel" autocomplete="tel"><input type="email" id="em" placeholder="or email" autocomplete="email"><p class="hint">A phone or an email is needed.</p>';
  h += '<p class="q" style="margin-top:16px">Would you like an owner to reply?</p><div class="opts" data-f="reply">'
    + '<button class="opt" data-v="call">Yes, call me</button><button class="opt" data-v="private">Yes, a private written reply</button><button class="opt" data-v="none">No reply needed</button></div></div>';
  h += '<div class="err" id="err"></div><button class="go" id="send">Send to the owners</button>'
    + '<p class="promise"><b>What we promise:</b> only the owners can open this. Your coordinator cannot see it, or even that you wrote. If it is about keeping someone safe, the owners may need to involve others, and will share as little as they can.</p>'
    + '<p class="foot">Rather talk? Call <a href="' + OFFICE_TEL + '">' + OFFICE + '</a> and ask for Samantha or Zach.</p>';
  $('#main').innerHTML = h;
  document.querySelectorAll('.opts').forEach(g => g.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    g.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); M[g.dataset.f] = b.dataset.v; $('#err').style.display = 'none';
  }));
  const nm = $('#notme'); if (nm) nm.onclick = e => { e.preventDefault(); who = SAMPLE.standalone; compose(); };
  $('#send').onclick = send;
}

function fail(t) { const e = $('#err'); e.textContent = t; e.style.display = 'block'; e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function send() {
  M.body = $('#body').value.trim();
  if (!M.kind) return fail('Pick what you would like to share.');
  if (M.body.length < 3) return fail('Write your message first.');
  if (!who.known) {
    M.name = $('#nm').value.trim(); M.phone = $('#ph').value.replace(/\D/g, ''); M.email = $('#em').value.trim();
    if (!M.name) return fail('Add your name.');
    if (!M.role) return fail('Tell us who you are.');
    if (M.phone.length < 10 && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(M.email)) return fail('Add a 10-digit phone or an email.');
  }
  if (!M.reply) return fail('Tell us if you would like a reply.');
  /* Real mode posts {code?, kind, body, reply, name?, phone?, email?, role?} to owner-inbox. The sample never sends. */
  $('#h1').textContent = 'Sent to the owners';
  $('#lead').textContent = '';
  const next = M.reply === 'call' ? 'Samantha or Zach will call you.' : M.reply === 'private' ? 'When an owner replies, we will text you a private link. The words stay on this secure page.' : 'Thank you for telling us.';
  $('#main').innerHTML = '<div class="card done"><div class="big">💛</div><h2 class="serif">Thank you' + (who.known ? ', ' + esc(who.first) : '') + '</h2><p>Only the owners will read it. ' + next + '</p></div>'
    + '<p class="foot">Something urgent? Call <a href="' + OFFICE_TEL + '">' + OFFICE + '</a>.</p>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function verify() {
  $('#h1').textContent = 'You have a private reply';
  $('#lead').textContent = 'To keep it private, we will send a code to the phone we have on file for you.';
  $('#main').innerHTML = '<div class="card" style="text-align:center"><p class="q">Enter the 6-digit code</p><p class="hint">Sent to the phone ending in 42. It works for 10 minutes.</p>'
    + '<div class="code">' + [...Array(6)].map((_, i) => '<input inputmode="numeric" maxlength="1" aria-label="Digit ' + (i + 1) + '">').join('') + '</div>'
    + '<div class="err" id="err"></div><button class="go" id="ok" style="margin-top:16px">Open my conversation</button>'
    + '<p class="hint" style="margin-top:12px"><a href="#" id="resend" style="color:var(--teal);font-weight:600">Send a new code</a></p></div>'
    + '<p class="promise">Sample: any 6 digits open it. Five wrong codes lock the link and the owners are told.</p>';
  const ins = [...document.querySelectorAll('.code input')];
  ins.forEach((el, i) => el.oninput = () => { el.value = el.value.replace(/\D/g, ''); if (el.value && ins[i + 1]) ins[i + 1].focus(); });
  ins[0].focus();
  $('#resend').onclick = e => { e.preventDefault(); $('#resend').textContent = 'New code sent'; };
  $('#ok').onclick = () => { if (ins.map(x => x.value).join('').length !== 6) return fail('Enter all 6 digits.'); thread(); };
}

function thread() {
  $('#h1').textContent = 'Your private conversation';
  $('#lead').textContent = 'Only you and the owners can see this.';
  const msgs = [
    ['me', 'You · Nov 12', 'I have been getting fewer hours since my client went into the hospital and I did not want to bring it up with the office.'],
    ['owner', 'Zach · Nov 13', 'Thank you for telling me, Rachel. I have asked the team to look at open shifts near you this week without mentioning your note. Would mornings work?'],
  ];
  $('#main').innerHTML = '<p class="timer" id="timer">This page closes in 15:00 to keep it private</p>'
    + msgs.map(([c, w, t]) => '<div class="msg ' + c + '"><div class="who">' + esc(w) + '</div>' + esc(t) + '</div>').join('')
    + '<div class="card"><textarea id="rep" placeholder="Write back" maxlength="4000"></textarea><div class="err" id="err"></div><button class="go" id="snd" style="margin-top:10px">Send reply</button></div>'
    + '<p class="promise">Replies are not texted or emailed. We only tell you a new reply is waiting.</p>';
  $('#snd').onclick = () => { const t = $('#rep').value.trim(); if (!t) return fail('Write your reply first.'); const d = document.createElement('div'); d.className = 'msg me'; d.innerHTML = '<div class="who">You · now</div>' + esc(t); document.querySelector('.card').before(d); $('#rep').value = ''; };
  let left = 900; const tm = setInterval(() => { left--; const el = $('#timer'); if (!el) return clearInterval(tm); el.textContent = 'This page closes in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' to keep it private'; if (left <= 0) { clearInterval(tm); verify(); } }, 1000);
}

function go(v) { if (v === 'reply') return verify(); who = SAMPLE[v] || SAMPLE.standalone; compose(); }
if (DEMO) { $('#sample').hidden = false; const s = $('#sWho'); s.value = SAMPLE[DEMO] || DEMO === 'reply' ? DEMO : 'standalone'; s.onchange = () => go(s.value); go(s.value); }
else { $('#main').innerHTML = '<div class="card done"><div class="big">🌱</div><h2 class="serif">This page is not open yet</h2><p>To reach the owners, call <a href="' + OFFICE_TEL + '">' + OFFICE + '</a> and ask for Samantha or Zach.</p></div>'; }
</script>
</body></html>
